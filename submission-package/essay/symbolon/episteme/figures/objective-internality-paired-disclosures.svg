  <text x="390" y="357" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#55493c">potency · M39</text>
  <line x1="766" y1="341" x2="676" y2="341" stroke="#5b5347" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="770" y="310" width="210" height="62" rx="6" fill="#efe6db" stroke="#a89a83" stroke-width="1.2"/>
  <text x="785" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2620">L3′ · Chronological</text>

