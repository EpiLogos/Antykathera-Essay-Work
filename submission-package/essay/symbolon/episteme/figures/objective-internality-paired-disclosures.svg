  <text x="390" y="441" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#55493c">transformation · M40</text>
  <line x1="766" y1="425" x2="676" y2="425" stroke="#5b5347" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="770" y="394" width="210" height="62" rx="6" fill="#efe6db" stroke="#a89a83" stroke-width="1.2"/>
  <text x="779" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2c2620">L2′ · Alchemical-Elemental</text>

  <!-- row 5: S4 -->
  <rect x="60" y="478" width="210" height="62" rx="6" fill="#efe6db" stroke="#a89a83" stroke-width="1.2"/>
  <text x="75" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2620">L4 · Phenomenological</text>
  <line x1="270" y1="509" x2="368" y2="509" stroke="#5b5347" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="372" y="478" width="296" height="62" rx="6" fill="#f3ece0" stroke="#6f6252" stroke-width="2"/>
  <text x="390" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2620">S4 — Workcell</text>
  <text x="390" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#55493c">situated existence · M41</text>
  <line x1="766" y1="509" x2="676" y2="509" stroke="#5b5347" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="770" y="478" width="210" height="62" rx="6" fill="#efe6db" stroke="#a89a83" stroke-width="1.2"/>
  <text x="785" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2620">L1′ · Phenomenal</text>

