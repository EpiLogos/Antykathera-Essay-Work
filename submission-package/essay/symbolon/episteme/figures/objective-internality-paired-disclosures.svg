  <rect x="60" y="562" width="210" height="62" rx="6" fill="#efe6db" stroke="#a89a83" stroke-width="1.2"/>
  <text x="75" y="589" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2620">L5 · Para Vāk</text>
  <line x1="270" y1="593" x2="368" y2="593" stroke="#5b5347" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="372" y="562" width="296" height="62" rx="6" fill="#f3ece0" stroke="#6f6252" stroke-width="2"/>
