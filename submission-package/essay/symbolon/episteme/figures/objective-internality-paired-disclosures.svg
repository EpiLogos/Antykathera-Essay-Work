  <!-- invariant line -->
  <text x="520" y="688" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2c2620">Declared pairing: Lₙ × L₍₅₋ₙ₎′ — the two lens indices of every pair sum to 5; the product owns the whole pair.</text>

  <!-- status band -->
  <rect x="30" y="706" width="980" height="36" rx="6" fill="#ece7db" stroke="#a89a83" stroke-width="1"/>
  <text x="46" y="729" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#55493c"><tspan font-weight="700" fill="#2c2620">Status: Argued.</tspan> Pairs, product glosses and movement numbers as declared in the S0–S5 records; products reconstituted/developed under T25, T26 ratification pending.</text>

  <text x="520" y="760" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a7f70">Original own-work SVG · record: objective-internality-paired-disclosures.md · 2026-09-25</text>
