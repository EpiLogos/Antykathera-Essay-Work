<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Syn-ballein: (0/1)/(1/0) retains the relation, as a broken token keeps its fit</title>
<desc id="d">Top: two boxes, zero over one and one over zero, joined by a double arrow reading zero over one equals one over zero: one relation under opposite orientations. Zero over one is the ground becoming articulate in a determination; one over zero is the determination turned toward the ground it cannot enclose. A long outer stroke beneath both relates the two readings; AND retains participation in one event, OR retains the difference through which either orientation can be taken. A strip notes that ordinary arithmetic keeps the asymmetry: zero over one is defined and one over zero is not. Bottom: three states of a broken token. Two halves fitted along matching jagged edges: recognition through the maintained break. One half alone beside a dashed empty outline: a lost piece, so no matching can occur (severance). One unbroken lump: both melted, the seam that could authenticate the relation is gone (fusion).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#211d18"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2f2b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6659"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e3a59"/></marker></defs>
<rect x="0" y="0" width="1100" height="940" fill="#f5f0e6"/>
<text x="550" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">DIAGRAM · SYN-BALLEIN, THE RETAINED RELATION</text>
<text x="550" y="94" font-size="16" fill="#6f6659" text-anchor="middle" font-style="italic">the outer stroke holds both orientations; the fit of a broken token holds its two halves</text>
<rect x="120" y="150" width="300" height="130" rx="8" fill="#efe8da" stroke="#211d18" stroke-width="2"/>
<text x="270" y="212" font-size="46" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">0/1</text>
<text x="270" y="244" font-size="15.5" fill="#6f6659" text-anchor="middle">the ground becoming articulate</text>
<text x="270" y="264" font-size="15.5" fill="#6f6659" text-anchor="middle">in a determination</text>
<rect x="680" y="150" width="300" height="130" rx="8" fill="#efe8da" stroke="#211d18" stroke-width="2"/>
<text x="830" y="212" font-size="46" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">1/0</text>
<text x="830" y="244" font-size="15.5" fill="#6f6659" text-anchor="middle">the determination turned toward</text>
<text x="830" y="264" font-size="15.5" fill="#6f6659" text-anchor="middle">the ground it cannot enclose</text>
<line x1="432" y1="202" x2="668" y2="202" stroke="#8a2f2b" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#ahr)"/>
<line x1="668" y1="234" x2="432" y2="234" stroke="#8a2f2b" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#ahr)"/>
<text x="550" y="222" font-size="17" fill="#8a2f2b" text-anchor="middle" font-family="'Courier New', Courier, monospace">0/1 = 1/0</text>
<text x="550" y="258" font-size="14.5" fill="#8a2f2b" text-anchor="middle">one relation, opposite orientations</text>
<line x1="120" y1="314" x2="980" y2="314" stroke="#211d18" stroke-width="4" stroke-linecap="round"/>
<text x="550" y="348" font-size="24" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">(0/1)/(1/0)</text>
<text x="550" y="374" font-size="15.5" fill="#6f6659" text-anchor="middle" font-style="italic">the outer stroke relates the two readings; the inner strokes keep ground and manifestation</text>
<text x="210" y="412" font-size="19" fill="#2e3a59" text-anchor="middle" font-weight="bold">AND</text>
<text x="270" y="412" font-size="16" fill="#211d18" text-anchor="start">retains participation in one event</text>
<text x="700" y="412" font-size="19" fill="#2e3a59" text-anchor="middle" font-weight="bold">OR</text>
<text x="730" y="412" font-size="16" fill="#211d18" text-anchor="start">retains the difference through which</text>
<text x="730" y="434" font-size="16" fill="#211d18" text-anchor="start">either orientation can be taken</text>
<rect x="120" y="464" width="860" height="52" rx="6" fill="none" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="550" y="486" font-size="15" fill="#6f6659" text-anchor="middle">ordinary arithmetic keeps the asymmetry: 0/1 is defined, 1/0 is not. The return adds no numerical object to complete it;</text>
<text x="550" y="506" font-size="15" fill="#6f6659" text-anchor="middle">it changes how the achieved form is held.</text>
<text x="550" y="590" font-size="19" fill="#211d18" text-anchor="middle" font-style="italic">the symbolon: recognition happens through the maintained break</text>
<line x1="60" y1="608" x2="1040" y2="608" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<path d="M 183 686 L 192 703.714 L 174 721.429 L 192 739.143 L 174 756.857 L 192 774.571 L 174 792.286 L 183 810 A 62 62 0 0 1 183 686 Z" fill="#efe8da" stroke="#211d18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 197 686 L 206 703.714 L 188 721.429 L 206 739.143 L 188 756.857 L 206 774.571 L 188 792.286 L 197 810 A 62 62 0 0 0 197 686 Z" fill="#efe8da" stroke="#211d18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="848" font-size="17" fill="#211d18" text-anchor="middle" font-weight="bold">fitted halves</text>
<text x="190" y="870" font-size="14.5" fill="#6f6659" text-anchor="middle">the fit authenticates the relation</text>
<text x="190" y="890" font-size="14.5" fill="#6f6659" text-anchor="middle">through their difference</text>
<text x="190" y="664" font-size="15.5" fill="#2e3a59" text-anchor="middle" font-style="italic">syn-ballein</text>
<path d="M 543 686 L 552 703.714 L 534 721.429 L 552 739.143 L 534 756.857 L 552 774.571 L 534 792.286 L 543 810 A 62 62 0 0 1 543 686 Z" fill="#efe8da" stroke="#211d18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 557 686 L 566 703.714 L 548 721.429 L 566 739.143 L 548 756.857 L 566 774.571 L 548 792.286 L 557 810 A 62 62 0 0 0 557 686 Z" fill="none" stroke="#b9ae9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="550" y="848" font-size="17" fill="#211d18" text-anchor="middle" font-weight="bold">a lost half</text>
<text x="550" y="870" font-size="14.5" fill="#6f6659" text-anchor="middle">no matching can occur;</text>
<text x="550" y="890" font-size="14.5" fill="#6f6659" text-anchor="middle">the fracture still has its shape</text>
<text x="550" y="664" font-size="15.5" fill="#8a2f2b" text-anchor="middle" font-style="italic">severance</text>
<path d="M 848 748 C 848 678, 920 672, 972 728 C 984 788, 940 816, 900 810 C 860 806, 848 788, 848 748 Z" fill="#efe8da" stroke="#211d18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="910" y="848" font-size="17" fill="#211d18" text-anchor="middle" font-weight="bold">one lump</text>
<text x="910" y="870" font-size="14.5" fill="#6f6659" text-anchor="middle">the seam that could authenticate</text>
<text x="910" y="890" font-size="14.5" fill="#6f6659" text-anchor="middle">the relation has disappeared</text>
<text x="910" y="664" font-size="15.5" fill="#8a2f2b" text-anchor="middle" font-style="italic">fusion</text>
</svg>
