<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">One derivative, a family of antiderivatives, one condition that selects</title>
<desc id="d">A plot of the parabolas F of x equals x squared plus C for C equal to minus one, zero, one, two, three and four. At x equal to one each curve carries a short tangent segment of slope two: the same derivative, two x, for every member. The curve with C equal to three is drawn in red and passes through the marked point x zero, F zero equals three: the condition that selects one member of the family. A text column states that the derivative was exact throughout and lacked only the information needed to select the additive constant.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#211d18"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2f2b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6659"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e3a59"/></marker></defs>
<rect x="0" y="0" width="1100" height="760" fill="#f5f0e6"/>
<text x="550" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">DIAGRAM · WHAT THE DERIVATIVE CANNOT RECOVER</text>
<text x="550" y="94" font-size="16" fill="#6f6659" text-anchor="middle" font-style="italic">local exactness can be complete as local exactness and still leave the constant open</text>
