<circle cx="340" cy="408.8" r="8" fill="#f5f0e6" stroke="#8a2f2b" stroke-width="3"/>
<text x="640" y="176" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">the family</text>
<text x="640" y="210" font-size="24" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">F(x) = x² + C</text>
<text x="640" y="252" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">the same slope at every x</text>
<text x="640" y="286" font-size="22" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">F′(x) = 2x, for every C</text>
<text x="640" y="322" font-size="15.5" fill="#6f6659" text-anchor="start">the short black segments, all slope 2 at x = 1</text>
<text x="640" y="372" font-size="17" fill="#211d18" text-anchor="start">integrating 2x returns the family,</text>
<text x="640" y="396" font-size="17" fill="#211d18" text-anchor="start">not one function</text>
<text x="640" y="446" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">a condition selects one member (the red ring, x = 0)</text>
<text x="640" y="480" font-size="22" fill="#8a2f2b" text-anchor="start" font-family="'Courier New', Courier, monospace">F(0) = 3  ⟹  C = 3</text>
<rect x="626" y="520" width="440" height="118" rx="6" fill="none" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="646" y="548" font-size="16.5" fill="#211d18" text-anchor="start">The derivative was exact throughout.</text>
<text x="646" y="572" font-size="16.5" fill="#211d18" text-anchor="start">What it lacked was the information needed</text>
<text x="646" y="596" font-size="16.5" fill="#211d18" text-anchor="start">to select the additive constant.</text>
<text x="550" y="690" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">The family statement holds on an interval; disconnected domains can carry separate constants.</text>
<text x="550" y="716" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">QL reads this dependence as a demand that local determination remain related to its provenance, not as a defect of precision.</text>
</svg>
