<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1020" viewBox="0 0 920 1020" role="img" aria-labelledby="t d">
  <title id="t">The crossed-zero recognition chain: 0 → Ø → X → Ø/X → (0/Ø)/(1/X) → 1, returning to 0/1</title>
  <desc id="d">A vertical chain of six boxed native signs, each with its office named to the right, and a curved return arrow from the final sign 1 down to a seventh box 0/1, marking recognition returning through another appearing-act.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2a2a"/>
    </marker>
  </defs>
  <style>
    .tok { font-family: "Courier New", Courier, monospace; font-weight: bold; fill: #1a1a1a; }
    .lab { font-family: Georgia, "Times New Roman", serif; fill: #3d3d3d; }
    .mut { font-family: Georgia, "Times New Roman", serif; fill: #6b6b6b; }
    .acc { fill: #8a2a2a; }
    .box { fill: #f7f4ee; stroke: #1a1a1a; stroke-width: 1.4; }
    .accbox { fill: #faf3f0; stroke: #8a2a2a; stroke-width: 1.6; }
  </style>

  <rect x="0" y="0" width="920" height="1020" fill="#ffffff"/>

  <text class="lab" x="40" y="38" font-size="20" font-weight="bold">The crossed-zero recognition chain</text>
  <text class="mut" x="40" y="60" font-size="13">native determinations in the theorem field &#8212; each sign names an operation; nothing is cancelled under ordinary arithmetic</text>

  <!-- 0 -->
  <rect class="box" x="65" y="92" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="126" font-size="24" text-anchor="middle">0</text>
  <text class="lab" x="270" y="112" font-size="13.5">the unobjectifiable condition of the appearing event &#8212; indicated,</text>
  <text class="lab" x="270" y="130" font-size="13.5">not made a hidden thing behind the event</text>
  <line x1="150" y1="144" x2="150" y2="184" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Ø -->
  <rect class="box" x="65" y="190" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="224" font-size="24" text-anchor="middle">&#216;</text>
  <text class="lab" x="270" y="202" font-size="13.5">a formed means of self-relating takes the subject&#8217;s place: mediation</text>
  <text class="lab" x="270" y="220" font-size="13.5">has entered the source-position while concealing that entry</text>
  <text class="lab" x="270" y="238" font-size="13.5">(the inner instrument under the stroke)</text>
  <line x1="150" y1="242" x2="150" y2="282" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- X -->
  <rect class="box" x="65" y="288" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="322" font-size="24" text-anchor="middle">X</text>
  <text class="lab" x="270" y="300" font-size="13.5">the differentiated object-world deposited by discriminating activity;</text>
  <text class="lab" x="270" y="318" font-size="13.5">this local X marks the world &#8212; it is not capital X of `X/x`</text>
  <line x1="150" y1="340" x2="150" y2="380" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Ø/X -->
  <rect class="box" x="65" y="386" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="420" font-size="24" text-anchor="middle">&#216;/X</text>
  <text class="lab" x="270" y="398" font-size="13.5">the bar becomes available as mediation: the means ceases to go</text>
  <text class="lab" x="270" y="416" font-size="13.5">unnoticed and becomes transparent &#8212; seen through what it discloses;</text>
  <text class="lab" x="270" y="434" font-size="13.5">no additional observer is placed outside it</text>
  <line x1="150" y1="438" x2="150" y2="478" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- (0/Ø)/(1/X) -->
  <rect class="box" x="65" y="484" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="518" font-size="19" text-anchor="middle">(0/&#216;)/(1/X)</text>
  <text class="lab" x="270" y="496" font-size="13.5">the meta-relation: unoccluded and occluded subject-side, integrated</text>
  <text class="lab" x="270" y="514" font-size="13.5">and differentiated object-side, and their inverse readings available</text>
  <text class="lab" x="270" y="532" font-size="13.5">together &#8212; the parentheses keep the relations, they cancel nothing</text>
  <line x1="150" y1="536" x2="150" y2="576" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 1 -->
  <rect class="box" x="65" y="582" width="170" height="52" rx="9"/>
  <text class="tok" x="150" y="616" font-size="24" text-anchor="middle">1</text>
  <text class="lab" x="270" y="594" font-size="13.5">achieved recognition: the appearing-act recognised as one &#8212;</text>
  <text class="lab" x="270" y="612" font-size="13.5">including the ego&#8217;s mediation among the conditions now</text>
  <text class="lab" x="270" y="630" font-size="13.5">available to inquiry</text>

  <!-- return arc -->
  <path d="M 235 640 C 380 700, 440 720, 500 780" fill="none" stroke="#8a2a2a" stroke-width="2" marker-end="url(#arrAcc)"/>
  <text class="lab acc" x="300" y="730" font-size="13.5" text-anchor="middle">recognition returns through</text>
  <text class="lab acc" x="300" y="748" font-size="13.5" text-anchor="middle">another appearing-act</text>

  <!-- return node -->
  <rect class="accbox" x="450" y="790" width="150" height="52" rx="9"/>
  <text class="tok" x="525" y="824" font-size="24" text-anchor="middle">0/1</text>
  <text class="lab" x="380" y="868" font-size="13.5">the zero stays active within the one: a definite judgment can be</text>
  <text class="lab" x="380" y="886" font-size="13.5">made again, with the means of judgment restored to its office</text>
  <text class="lab" x="380" y="904" font-size="13.5">(kart&#7771; / k&#257;rya related, not interchangeable)</text>

  <!-- boundary band -->
  <line x1="40" y1="942" x2="880" y2="942" stroke="#c9c4ba" stroke-width="1"/>
  <text class="mut" x="40" y="968" font-size="12.5">This &#216; is neither the empty-set sign &#8709; nor Lacan&#8217;s barred subject; the chain&#8217;s terms are local determinations</text>
  <text class="mut" x="40" y="986" font-size="12.5">of the native theorem-field, read under the declared native operation.</text>
</svg>
