<text x="550" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">DIAGRAM · A RETURN THAT KEEPS ITS WINDING</text>
<text x="550" y="94" font-size="16" fill="#6f6659" text-anchor="middle" font-style="italic">the surface-address recurs; the lifted path retains a displacement</text>
