<text x="968" y="391" font-size="14.5" fill="#2e3a59" text-anchor="start">all four corners:</text>
<text x="968" y="409" font-size="14.5" fill="#2e3a59" text-anchor="start">one point</text>
<text x="825" y="425" font-size="15.5" fill="#8a2f2b" text-anchor="middle">the path starts and ends at that point</text>
<text x="825" y="445" font-size="14.5" fill="#6f6659" text-anchor="middle">(two segments; the right edge continues the left)</text>
<rect x="60" y="482" width="980" height="74" rx="6" fill="none" stroke="#b9ae9c" stroke-width="1.2"/>
<text x="550" y="510" font-size="18" fill="#211d18" text-anchor="middle">lifted endpoints differ; quotient endpoints coincide; the pair (2, −1) is retained</text>
<text x="550" y="536" font-size="16" fill="#6f6659" text-anchor="middle">two turns one way and one back; no deformation keeping the loop based can erase it:  π₁(T²) = ℤ × ℤ</text>
<text x="550" y="600" font-size="16.5" fill="#211d18" text-anchor="middle" font-style="italic">even on one torus, the law of motion decides what return means:  [αt, βt] returns at T &gt; 0 only if Tα and Tβ are both integers</text>
