<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="904" viewBox="0 0 1100 904" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">A closed path on the torus carries winding (2, −1); a linear flow returns only for a rational ratio</title>
<desc id="d">Left, the covering plane with its integer lattice and the straight path from the origin to the point two, minus one; the endpoints differ in the plane. An arrow labelled quotient by whole-number steps leads to the unit square on the right, where the same path appears as two parallel segments, from the top-left corner to the middle of the right edge and from the middle of the left edge to the bottom-right corner. All four corners are one point of the torus, so the path closes; its winding class, two turns one way and one back, is retained. Beneath, two linear flows drawn in the unit square: with rates in the ratio three to two the path closes at time one; with rates in the ratio one to the square root of two it never closes and keeps filling the square.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#211d18"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2f2b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6659"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e3a59"/></marker></defs>
