<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">A pair of dice counted three ways: 36 ordered states, 21 unordered outcomes, 11 totals</title>
<desc id="d">A six-by-six grid of die A against die B holds the thirty-six ordered states of the pair. The six doubles lie on the diagonal; the thirty other cells fold across it into fifteen mirrored pairs. The pair A=1,B=2 and A=2,B=1 is highlighted: two ordered states with the same values and the same total of three. Three ledgers to the right give the counts under three accounts: thirty-six when each die is tracked, twenty-one when the labels are dropped, eleven when only the total is recorded.</desc>
