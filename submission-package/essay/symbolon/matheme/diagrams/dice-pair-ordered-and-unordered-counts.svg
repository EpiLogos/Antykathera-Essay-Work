<text x="182" y="639" font-size="15" fill="#211d18" text-anchor="start">double (the diagonal): one state, its own mirror</text>
<rect x="150" y="655" width="22" height="22" rx="0" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.2"/>
<text x="182" y="672" font-size="15" fill="#211d18" text-anchor="start">mirrored pair: two ordered states, one unordered outcome</text>
<rect x="150" y="688" width="22" height="22" rx="0" fill="#ecc9c2" stroke="#8a2f2b" stroke-width="2"/>
<text x="182" y="705" font-size="15" fill="#8a2f2b" text-anchor="start">the essay's pair: (A=1, B=2) and (A=2, B=1), both with total 3</text>
<rect x="640" y="190" width="410" height="130" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.5"/>
<text x="660" y="222" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">keep which die is which</text>
