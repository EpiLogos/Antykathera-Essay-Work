<text x="764" y="290" font-size="15" fill="#6f6659" text-anchor="start">6 doubles + 30 off-diagonal cells</text>
<rect x="640" y="380" width="410" height="130" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.5"/>
<text x="660" y="412" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">stop caring which die is which</text>
