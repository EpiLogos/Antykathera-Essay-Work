<text x="764" y="454" font-size="18" fill="#211d18" text-anchor="start">unordered outcomes</text>
<text x="764" y="480" font-size="15" fill="#6f6659" text-anchor="start">6 doubles + 15 mirrored pairs</text>
<rect x="640" y="570" width="410" height="130" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.5"/>
<text x="660" y="602" font-size="17" fill="#6f6659" text-anchor="start" font-style="italic">record only the total</text>
<text x="702" y="668" font-size="58" fill="#8a2f2b" text-anchor="middle">11</text>
<text x="764" y="644" font-size="18" fill="#211d18" text-anchor="start">totals, from 2 to 12</text>
<text x="764" y="670" font-size="15" fill="#6f6659" text-anchor="start">the total 3 keeps (1,2) and (2,1) as one entry</text>
<line x1="702" y1="318" x2="702" y2="372" stroke="#8a2f2b" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ahr)"/>
<text x="720" y="350" font-size="15" fill="#8a2f2b" text-anchor="start">drop the labels: 30 cells fold in pairs</text>
<line x1="702" y1="508" x2="702" y2="562" stroke="#8a2f2b" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ahr)"/>
<text x="720" y="540" font-size="15" fill="#8a2f2b" text-anchor="start">drop the values: keep the total</text>
<text x="550" y="770" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">Nothing mysterious has happened: the account has changed what it retains, so the number answers a different question each time.</text>
