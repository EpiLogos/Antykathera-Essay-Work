<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="t d">
  <title id="t">NOR functional completeness, and the seam against the QL slash</title>
  <desc id="d">Upper zone: the single connective NOR, written p down-arrow q, generates negation, disjunction and conjunction by displayed reductions, and hence every Boolean truth function. A bold horizontal seam separates this defined field from the lower zone, which states what the scene does not give: the native QL slash relating a determination to its unobjectifiable condition.</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .tok  { font-family: "Courier New", Courier, monospace; fill: #1a1a1a; }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #1a1a1a; }
    .lab  { font-family: Georgia, "Times New Roman", serif; fill: #3d3d3d; }
    .mut  { font-family: Georgia, "Times New Roman", serif; fill: #6b6b6b; }
    .acc  { fill: #8a2a2a; }
    .card { fill: #f7f4ee; stroke: #1a1a1a; stroke-width: 1.3; }
    .topcard { fill: #faf6ee; stroke: #1a1a1a; stroke-width: 1.6; }
  </style>

  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <!-- upper zone -->
  <text class="lab" x="40" y="38" font-size="20" font-weight="bold">One connective generates the Boolean field</text>

  <rect class="topcard" x="40" y="58" width="440" height="58" rx="8"/>
  <text class="math" x="260" y="84" font-size="20" text-anchor="middle">p &#8595; q = &#172;(p &#8744; q)</text>
  <text class="mut" x="260" y="105" font-size="12" text-anchor="middle">NOR: true just when both inputs are false</text>

  <line x1="260" y1="116" x2="260" y2="146" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text class="mut" x="272" y="136" font-size="12">applied to its own outputs</text>

  <g>
    <rect class="card" x="60"  y="152" width="250" height="64" rx="8"/>
    <text class="math" x="185" y="180" font-size="17" text-anchor="middle">&#172;p = p &#8595; p</text>
    <text class="mut" x="185" y="202" font-size="12" text-anchor="middle">negation</text>

    <rect class="card" x="350" y="152" width="290" height="64" rx="8"/>
    <text class="math" x="495" y="180" font-size="17" text-anchor="middle">p &#8744; q = (p &#8595; q) &#8595; (p &#8595; q)</text>
    <text class="mut" x="495" y="202" font-size="12" text-anchor="middle">disjunction: double denial of NOR</text>

    <rect class="card" x="680" y="152" width="260" height="64" rx="8"/>
    <text class="math" x="810" y="180" font-size="17" text-anchor="middle">p &#8743; q = (p &#8595; p) &#8595; (q &#8595; q)</text>
    <text class="mut" x="810" y="202" font-size="12" text-anchor="middle">conjunction: NOR of the negated inputs</text>
  </g>

  <line x1="185" y1="216" x2="185" y2="244" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="495" y1="216" x2="495" y2="244" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="810" y1="216" x2="810" y2="244" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr2)"/>

  <rect class="card" x="150" y="250" width="680" height="66" rx="8"/>
  <text class="lab" x="490" y="278" font-size="15" text-anchor="middle">every Boolean truth function of a positive finite number of inputs</text>
  <text class="mut" x="490" y="300" font-size="12" text-anchor="middle">select each true input pattern by a conjunction of inputs or their negations; join the selected patterns with &#8744; &#183; &#8869; = p &#8595; (p &#8595; p)</text>

  <text class="mut" x="490" y="344" font-size="12.5" text-anchor="middle">arrangement preserves differentiated answers even though the same connective is used throughout.</text>

  <!-- the seam -->
  <line x1="40" y1="386" x2="940" y2="386" stroke="#8a2a2a" stroke-width="2.4"/>
  <rect x="300" y="372" width="380" height="28" fill="#ffffff"/>
  <text class="lab acc" x="490" y="391" font-size="14" text-anchor="middle" font-weight="bold">the seam &#8212; functional completeness holds within a defined field of truth values</text>

  <!-- lower zone -->
  <rect x="0" y="400" width="980" height="240" fill="#fcfbf8"/>
  <text class="lab" x="40" y="438" font-size="18" font-weight="bold">What this scene does not give</text>

  <rect x="120" y="462" width="740" height="96" rx="10" fill="#faf3f0" stroke="#8a2a2a" stroke-width="1.6"/>
  <text class="tok" x="490" y="500" font-size="24" text-anchor="middle" font-weight="bold">0/1</text>
  <text class="lab" x="490" y="530" font-size="14" text-anchor="middle">the native slash relates a determination to its unobjectifiable condition &#8212;</text>
  <text class="lab" x="490" y="548" font-size="14" text-anchor="middle">which is not another Boolean input, and is not generated by repeated denial</text>

  <text class="mut" x="490" y="592" font-size="12" text-anchor="middle">Boolean functional completeness neither replaces the native First Spanda equation nor generates the QL slash.</text>
  <text class="mut" x="490" y="612" font-size="12" text-anchor="middle">The displayed reductions are checkable directly; the historical Peirce&#8211;Sheffer&#8211;Wittgenstein sequence is not at issue here.</text>
</svg>
