<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">A shift the observations cannot see, a rescaling they can</title>
<desc id="d">Three rows apply different operations to the same three scores, 2, 1 and 0, for candidates A, B and C. Each row shows the scores as bars, the softmax distribution they give, and the Bradley-Terry preference of A over B. As given: probabilities 0.665, 0.245, 0.090 and preference 0.731. After adding the same constant, five, to every score: the probabilities and the preference are identical. After halving the scores: probabilities 0.506, 0.307, 0.186 and preference 0.622, a changed distribution. A footer gives the reference-policy form: a common addition to the reward cancels in normalisation, while replacing the reference policy does not.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#211d18"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2f2b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6659"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e3a59"/></marker></defs>
<rect x="0" y="0" width="1100" height="920" fill="#f5f0e6"/>
<text x="550" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">DIAGRAM · A SHIFT THE OBSERVATIONS CANNOT SEE, A RESCALING THEY CAN</text>
<text x="550" y="94" font-size="16" fill="#6f6659" text-anchor="middle" font-style="italic">softmax and the Bradley–Terry comparison depend on differences of scores, not on their origin</text>
<text x="330" y="150" font-size="16" fill="#6f6659" text-anchor="start" font-style="italic">scores</text>
<text x="580" y="150" font-size="16" fill="#6f6659" text-anchor="start" font-style="italic">softmax distribution</text>
<text x="830" y="150" font-size="16" fill="#6f6659" text-anchor="start" font-style="italic">preference of A over B</text>
<rect x="50" y="168" width="1000" height="196" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.4"/>
<text x="72" y="202" font-size="16.5" fill="#211d18" text-anchor="start" font-style="italic">the scores as given</text>
<text x="72" y="234" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">z = (2, 1, 0)</text>
<rect x="330" y="288" width="36" height="20" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="348" y="350" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">2</text>
<text x="348" y="328" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="384" y="298" width="36" height="10" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="402" y="350" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">1</text>
<text x="402" y="328" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="438" y="306.5" width="36" height="1.5" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="456" y="350" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">0</text>
<text x="456" y="328" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="318" y1="308" x2="482" y2="308" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="488" y1="258" x2="545" y2="258" stroke="#211d18" stroke-width="2" stroke-linecap="butt" marker-end="url(#ah)"/>
<text x="517" y="248" font-size="14.5" fill="#6f6659" text-anchor="middle">softmax</text>
<rect x="565" y="229.502" width="44" height="78.4984" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="587" y="350" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.665</text>
<text x="587" y="328" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="623" y="279.122" width="44" height="28.878" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="645" y="350" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.245</text>
<text x="645" y="328" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="681" y="297.376" width="44" height="10.6236" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="703" y="350" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.090</text>
<text x="703" y="328" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="555" y1="308" x2="735" y2="308" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<text x="790" y="234" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">P(A ≻ B) = σ(r_A − r_B)</text>
<text x="790" y="268" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">r_A − r_B = 1</text>
<text x="790" y="302" font-size="19" fill="#2e3a59" text-anchor="start" font-weight="bold" font-family="'Courier New', Courier, monospace">P = σ(1) = 0.731</text>
<rect x="50" y="374" width="1000" height="196" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.4"/>
<text x="72" y="408" font-size="16.5" fill="#211d18" text-anchor="start" font-style="italic">add the same constant to every score</text>
<text x="72" y="440" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">z + 5 = (7, 6, 5)</text>
<text x="72" y="482" font-size="16" fill="#2e3a59" text-anchor="start" font-weight="bold">invisible: the distribution</text>
<text x="72" y="504" font-size="16" fill="#2e3a59" text-anchor="start" font-weight="bold">is unchanged</text>
<rect x="330" y="444" width="36" height="70" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="348" y="556" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">7</text>
<text x="348" y="534" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="384" y="454" width="36" height="60" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="402" y="556" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">6</text>
<text x="402" y="534" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="438" y="464" width="36" height="50" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="456" y="556" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">5</text>
<text x="456" y="534" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="318" y1="514" x2="482" y2="514" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="488" y1="464" x2="545" y2="464" stroke="#211d18" stroke-width="2" stroke-linecap="butt" marker-end="url(#ah)"/>
<text x="517" y="454" font-size="14.5" fill="#6f6659" text-anchor="middle">softmax</text>
<rect x="565" y="435.502" width="44" height="78.4984" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="587" y="556" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.665</text>
<text x="587" y="534" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="623" y="485.122" width="44" height="28.878" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="645" y="556" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.245</text>
<text x="645" y="534" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="681" y="503.376" width="44" height="10.6236" rx="0" fill="#2e3a59" stroke="#211d18" stroke-width="1.2"/>
<text x="703" y="556" font-size="14.5" fill="#2e3a59" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.090</text>
<text x="703" y="534" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="555" y1="514" x2="735" y2="514" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<text x="790" y="440" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">P(A ≻ B) = σ(r_A − r_B)</text>
<text x="790" y="474" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">r_A − r_B = 1</text>
<text x="790" y="508" font-size="19" fill="#2e3a59" text-anchor="start" font-weight="bold" font-family="'Courier New', Courier, monospace">P = σ(1) = 0.731</text>
<rect x="50" y="580" width="1000" height="196" rx="6" fill="#efe8da" stroke="#b9ae9c" stroke-width="1.4"/>
<text x="72" y="614" font-size="16.5" fill="#211d18" text-anchor="start" font-style="italic">rescale the differences, temperature 2</text>
<text x="72" y="646" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">z / 2 = (1, 0.5, 0)</text>
<text x="72" y="688" font-size="16" fill="#8a2f2b" text-anchor="start" font-weight="bold">visible: the distribution</text>
<text x="72" y="710" font-size="16" fill="#8a2f2b" text-anchor="start" font-weight="bold">changes</text>
<rect x="330" y="710" width="36" height="10" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="348" y="762" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">1</text>
<text x="348" y="740" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="384" y="715" width="36" height="5" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="402" y="762" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.5</text>
<text x="402" y="740" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="438" y="718.5" width="36" height="1.5" rx="0" fill="#b9ae9c" stroke="#6f6659" stroke-width="1.2"/>
<text x="456" y="762" font-size="15" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">0</text>
<text x="456" y="740" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="318" y1="720" x2="482" y2="720" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="488" y1="670" x2="545" y2="670" stroke="#211d18" stroke-width="2" stroke-linecap="butt" marker-end="url(#ah)"/>
<text x="517" y="660" font-size="14.5" fill="#6f6659" text-anchor="middle">softmax</text>
<rect x="565" y="641.502" width="44" height="78.4984" rx="0" fill="none" stroke="#6f6659" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="565" y="660.235" width="44" height="59.7647" rx="0" fill="#8a2f2b" stroke="#211d18" stroke-width="1.2"/>
<text x="587" y="762" font-size="14.5" fill="#8a2f2b" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.506</text>
<text x="587" y="740" font-size="16" fill="#211d18" text-anchor="middle">A</text>
<rect x="623" y="691.122" width="44" height="28.878" rx="0" fill="none" stroke="#6f6659" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="623" y="683.751" width="44" height="36.2491" rx="0" fill="#8a2f2b" stroke="#211d18" stroke-width="1.2"/>
<text x="645" y="762" font-size="14.5" fill="#8a2f2b" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.307</text>
<text x="645" y="740" font-size="16" fill="#211d18" text-anchor="middle">B</text>
<rect x="681" y="709.376" width="44" height="10.6236" rx="0" fill="none" stroke="#6f6659" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="681" y="698.014" width="44" height="21.9862" rx="0" fill="#8a2f2b" stroke="#211d18" stroke-width="1.2"/>
<text x="703" y="762" font-size="14.5" fill="#8a2f2b" text-anchor="middle" font-family="'Courier New', Courier, monospace">0.186</text>
<text x="703" y="740" font-size="16" fill="#211d18" text-anchor="middle">C</text>
<line x1="555" y1="720" x2="735" y2="720" stroke="#6f6659" stroke-width="1.2" stroke-linecap="butt"/>
<text x="790" y="646" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">P(A ≻ B) = σ(r_A − r_B)</text>
<text x="790" y="680" font-size="17" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">r_A − r_B = 0.5</text>
<text x="790" y="714" font-size="19" fill="#8a2f2b" text-anchor="start" font-weight="bold" font-family="'Courier New', Courier, monospace">P = σ(0.5) = 0.622</text>
<text x="1030" y="610" font-size="14" fill="#6f6659" text-anchor="end" font-style="italic">dashed: the row-one distribution</text>
<line x1="60" y1="798" x2="1040" y2="798" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<text x="550" y="824" font-size="17" fill="#211d18" text-anchor="middle" font-style="italic">a common constant drops out in normalisation; a change to the measure of difference does not</text>
<text x="550" y="856" font-size="17" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">reference policy:  π*(y|x) ∝ π_ref(y|x) · exp(r(x,y)/β)</text>
<text x="550" y="884" font-size="15.5" fill="#6f6659" text-anchor="middle">adding a constant to r cancels through normalisation; replacing π_ref changes the weight each possibility departs from</text>
</svg>
