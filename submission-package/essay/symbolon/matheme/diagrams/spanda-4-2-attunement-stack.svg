<svg xmlns="http://www.w3.org/2000/svg" width="860" height="950" viewBox="0 0 860 950" role="img" aria-labelledby="t d">
  <title id="t">The Second Spanda vertical accounting: 100% = 2^6 + 6^2 = 64 + 36, read as ratio, reduced to 16/9 = 2^4/3^2, interpreted as 4+2, and cross-read into the ratio family</title>
  <desc id="d">A vertical stack of six bands joined by labelled arrows. Band one: the ordinary arithmetic identity one hundred equals sixty-four plus thirty-six. An arrow marked as a declared QL operation leads to band two, the proportional reduction to sixteen ninths equals two-to-the-four over three-squared. A further arrow marked as internal interpretation leads to band three, the base frame four plus two, fed from the side by the independently grounded sixfold two plus two squared equals six. Band four states the declared cross-comparison operator giving the pair four thirds and two thirds. Band five lays out the ratio family: fourth, fifth, totality-ratio, whole tone. Band six shows the exact completion sixteen ninths times nine eighths equals two, with the standing QL-composition identity beside it.</desc>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr4m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2a2a"/>
    </marker>
  </defs>
  <style>
    .tok  { font-family: "Courier New", Courier, monospace; fill: #1a1a1a; }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #1a1a1a; }
    .lab  { font-family: Georgia, "Times New Roman", serif; fill: #3d3d3d; }
    .mut  { font-family: Georgia, "Times New Roman", serif; fill: #6b6b6b; }
    .op   { font-family: Georgia, "Times New Roman", serif; fill: #8a2a2a; }
    .band { fill: #f7f4ee; stroke: #1a1a1a; stroke-width: 1.4; }
    .bandq{ fill: #faf3f0; stroke: #8a2a2a; stroke-width: 1.6; }
    .badge{ font-family: Georgia, "Times New Roman", serif; font-size: 11.5px; fill: #6b6b6b; }
  </style>

  <rect x="0" y="0" width="860" height="950" fill="#ffffff"/>

  <text class="lab" x="40" y="36" font-size="20" font-weight="bold">The vertical accounting &#8212; from 100% to the 4+2 base frame</text>
  <text class="mut" x="40" y="58" font-size="12.5">each arrow names the operation that carries it; bands are marked with the warrant each step actually has</text>

  <!-- band 1 -->
  <rect class="band" x="230" y="80" width="400" height="62" rx="8"/>
  <text class="math" x="430" y="110" font-size="19" text-anchor="middle">100% = 2&#8310; + 6&#178; = 64 + 36</text>
  <text class="badge" x="430" y="132" text-anchor="middle">Derived &#183; ordinary arithmetic identity</text>

  <line x1="430" y1="142" x2="430" y2="186" stroke="#8a2a2a" stroke-width="1.8" marker-end="url(#arr4m)"/>
  <text class="op" x="444" y="158" font-size="12.5">declared QL operation: the additive components are read as a ratio</text>
  <text class="op" x="444" y="175" font-size="12.5">(a chosen comparison &#8212; not implied by the equality)</text>

  <!-- band 2 -->
  <rect class="band" x="230" y="192" width="400" height="62" rx="8"/>
  <text class="math" x="430" y="222" font-size="19" text-anchor="middle">64/36 = 16/9 = 2&#8308;/3&#178;</text>
  <text class="badge" x="430" y="244" text-anchor="middle">Derived &#183; ordinary reduction and prime factorisation</text>

  <line x1="430" y1="254" x2="430" y2="298" stroke="#8a2a2a" stroke-width="1.8" marker-end="url(#arr4m)"/>
  <text class="op" x="444" y="270" font-size="12.5">internal interpretation: the exponents 4 and 2 are read against</text>
  <text class="op" x="444" y="287" font-size="12.5">the sixfold already derived &#8212; reflexive, not foundational</text>

  <!-- side rail: the sixfold -->
  <rect class="band" x="40" y="300" width="150" height="84" rx="8"/>
  <text class="math" x="115" y="334" font-size="15" text-anchor="middle">2 + 2&#178; = 2 + 4 = 6</text>
  <text class="mut" x="115" y="358" font-size="11.5" text-anchor="middle">the sixfold grounded</text>
  <text class="mut" x="115" y="373" font-size="11.5" text-anchor="middle">independently</text>
  <line x1="190" y1="342" x2="228" y2="360" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr4)"/>

  <!-- band 3 -->
  <rect class="bandq" x="230" y="304" width="400" height="76" rx="8"/>
  <text class="tok" x="430" y="342" font-size="28" text-anchor="middle" font-weight="bold">4+2</text>
  <text class="lab" x="430" y="368" font-size="13" text-anchor="middle">four explicate positions + two implicate poles</text>

  <line x1="430" y1="380" x2="430" y2="424" stroke="#8a2a2a" stroke-width="1.8" marker-end="url(#arr4m)"/>
  <text class="op" x="444" y="404" font-size="12.5">declared QL cross-comparison of the two readings of the six</text>

  <!-- band 4 -->
  <rect class="bandq" x="230" y="430" width="400" height="66" rx="8"/>
  <text class="math" x="430" y="458" font-size="17" text-anchor="middle">&#8459;_QL( 4:2 , 3:3 ) := ( 4/3 , 2/3 )</text>
  <text class="badge" x="430" y="482" text-anchor="middle">declared operator &#8212; an ordered pair of ratios, not ordinary fraction arithmetic</text>

  <line x1="430" y1="496" x2="430" y2="540" stroke="#8a2a2a" stroke-width="1.8" marker-end="url(#arr4m)"/>
  <text class="op" x="444" y="522" font-size="12.5">the selected ratios, named by standard just-ratio tuning theory</text>

  <!-- band 5: ratio family -->
  <rect class="band" x="120" y="546" width="620" height="96" rx="8"/>
  <g font-size="14.5">
    <text class="math" x="215" y="580" text-anchor="middle">4/3</text>
    <text class="mut" x="215" y="600" font-size="11.5" text-anchor="middle">perfect fourth</text>
    <text class="mut" x="215" y="616" font-size="11.5" text-anchor="middle">manifestation</text>

    <text class="math" x="356" y="580" text-anchor="middle">3/2</text>
    <text class="mut" x="356" y="600" font-size="11.5" text-anchor="middle">perfect fifth</text>
    <text class="mut" x="356" y="616" font-size="11.5" text-anchor="middle">aspirational lure</text>

    <text class="math" x="497" y="580" text-anchor="middle">16/9 = (4/3)&#178;</text>
    <text class="mut" x="497" y="600" font-size="11.5" text-anchor="middle">totality-ratio</text>
    <text class="mut" x="497" y="616" font-size="11.5" text-anchor="middle">the fourth taken twice</text>

    <text class="math" x="645" y="580" text-anchor="middle">9/8</text>
    <text class="mut" x="645" y="600" font-size="11.5" text-anchor="middle">whole tone</text>
    <text class="mut" x="645" y="616" font-size="11.5" text-anchor="middle">the live tick</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="272" y1="575" x2="312" y2="575"/>
    <line x1="412" y1="575" x2="444" y2="575"/>
    <line x1="556" y1="575" x2="604" y2="575"/>
  </g>

  <!-- band 6: completion -->
  <rect class="bandq" x="230" y="668" width="400" height="76" rx="8"/>
  <text class="math" x="430" y="700" font-size="19" text-anchor="middle">(16/9) &#183; (9/8) = 2/1</text>
  <text class="lab" x="430" y="728" font-size="12.5" text-anchor="middle">the remainder completes the span to the octave &#8212; exact, interpreted</text>

  <!-- standing identity -->
  <rect class="band" x="120" y="776" width="620" height="66" rx="8"/>
  <text class="math" x="430" y="804" font-size="16" text-anchor="middle">0/1 + 1/0 = 1/1 = 100%</text>
  <text class="mut" x="430" y="828" font-size="11.5" text-anchor="middle">the + is QL composition of the two orientations &#8212; not ordinary arithmetic</text>

  <!-- guard line -->
  <line x1="40" y1="862" x2="820" y2="862" stroke="#c9c4ba" stroke-width="1"/>
  <text class="mut" x="40" y="882" font-size="12">Exact in this stack: the arithmetic identity, the ratio reduction, the factorisation, the operator&#8217;s declared outputs,</text>
  <text class="mut" x="40" y="902" font-size="12">and the interval identities. Argued: the ratio-reading and its harmonic interpretation.</text>
  <text class="mut" x="40" y="922" font-size="12">The 9/8 is a remainder that completes, not a defect.</text>
</svg>
