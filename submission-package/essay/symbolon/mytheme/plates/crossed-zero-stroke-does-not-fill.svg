<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif" role="img">
<rect x="0" y="0" width="1200" height="900" fill="#f5f0e6"/>
<text x="600" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">PLATE · THE CROSSED ZERO</text>
<text x="600" y="94" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">a zero crossed by a stroke — the stroke does not fill the zero it crosses</text>
<circle cx="320" cy="430" r="160" fill="none" stroke="#211d18" stroke-width="10"/>
<line x1="243" y1="533" x2="397" y2="327" stroke="#211d18" stroke-width="30" stroke-linecap="butt"/>
<text x="320" y="650" font-size="16" fill="#211d18" text-anchor="middle">as finished character</text>
<text x="320" y="676" font-size="13.5" fill="#6f6659" text-anchor="middle">the mediating stroke fused with the zero it crosses —</text>
<text x="320" y="696" font-size="13.5" fill="#6f6659" text-anchor="middle">the operation no longer seen</text>
<text x="150" y="216" font-size="19" fill="#211d18" text-anchor="start" font-family="'Courier New', Courier, monospace">0 → Ø</text>
<circle cx="880" cy="430" r="160" fill="none" stroke="#211d18" stroke-width="10"/>
<line x1="803" y1="533" x2="957" y2="327" stroke="#8a2f2b" stroke-width="30" stroke-linecap="butt"/>
<rect x="977" y="240" width="18" height="18" fill="#211d18"/>
<line x1="962" y1="322" x2="983" y2="262" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="butt"/>
<text x="986" y="228" font-size="13.5" fill="#211d18" text-anchor="middle">the determinate mark</text>
<line x1="830" y1="502" x2="706" y2="596" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="butt"/>
<text x="640" y="614" font-size="13.5" fill="#211d18" text-anchor="start">zero-space — the subject-pole not exhausted as object</text>
<line x1="905" y1="408" x2="1040" y2="336" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="butt"/>
<text x="1048" y="330" font-size="13.5" fill="#211d18" text-anchor="start">the mediating stroke —</text>
<text x="1048" y="350" font-size="13.5" fill="#8a2f2b" text-anchor="start">legible as mediation</text>
<text x="1048" y="370" font-size="13.5" fill="#6f6659" text-anchor="start">nothing is erased</text>
<text x="600" y="758" font-size="12" fill="#6f6659" text-anchor="middle" font-style="italic">the recognition series — inscribed as horizon, not traversed here</text>
<text x="600" y="792" font-size="21" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">0 → Ø → X → Ø/X → (0/Ø)/(1/X) → 1 ↩ 0/1</text>
<text x="600" y="848" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">uncrossing is not erasing — the stroke becomes legible as mediation</text>
</svg>
