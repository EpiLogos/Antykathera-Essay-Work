<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Plate — The Psychoid Field: Two Descriptions Across One Seam</title>
<desc id="d">A single rectangular field on a paper ground, divided across its middle by a red dashed line captioned "one field — the seam is not a wall". Above the seam, two overlapping circles drawn in indigo are labelled "psychic description — image, meaning, significance". Below the seam, the same two overlapping circles drawn in black with small crosshair marks at their centres and tick marks at their intersections are labelled "physical description — event, measure, position". Fine dotted vertical lines join the upper and lower patterns across the seam, captioned "the same pattern — neither description reduces to the other". Base inscription: "two descriptions retained across one seam — the field precedes the division whose sides later disclose it differently."</desc>
<rect x="0" y="0" width="1200" height="900" fill="#f5f0e6"/>
<text x="600" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">PLATE · THE PSYCHOID FIELD</text>
<text x="600" y="94" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">a pattern appearing on both sides of an unmastered threshold</text>
<rect x="40" y="130" width="1120" height="630" fill="#efe8da" stroke="#b9ae9c" stroke-width="1"/>
<line x1="60" y1="445" x2="1140" y2="445" stroke="#8a2f2b" stroke-width="2" stroke-dasharray="10 8" stroke-linecap="butt"/>
<rect x="420" y="432" width="360" height="26" fill="#efe8da"/>
<text x="600" y="450" font-size="14" fill="#8a2f2b" text-anchor="middle">one field — the seam is not a wall</text>
<circle cx="540" cy="320" r="115" fill="none" stroke="#2e3a59" stroke-width="2.5"/>
<circle cx="660" cy="320" r="115" fill="none" stroke="#2e3a59" stroke-width="2.5"/>
<text x="90" y="250" font-size="14" fill="#2e3a59" text-anchor="start">psychic description —</text>
<text x="90" y="271" font-size="14" fill="#2e3a59" text-anchor="start">image, meaning, significance</text>
<circle cx="540" cy="570" r="115" fill="none" stroke="#211d18" stroke-width="2.5"/>
<circle cx="660" cy="570" r="115" fill="none" stroke="#211d18" stroke-width="2.5"/>
<line x1="530" y1="570" x2="550" y2="570" stroke="#211d18" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="540" y1="560" x2="540" y2="580" stroke="#211d18" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="650" y1="570" x2="670" y2="570" stroke="#211d18" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="660" y1="560" x2="660" y2="580" stroke="#211d18" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="592" y1="472" x2="608" y2="472" stroke="#211d18" stroke-width="1.0" stroke-linecap="butt"/>
<line x1="600" y1="464" x2="600" y2="480" stroke="#211d18" stroke-width="1.0" stroke-linecap="butt"/>
<line x1="592" y1="668" x2="608" y2="668" stroke="#211d18" stroke-width="1.0" stroke-linecap="butt"/>
<line x1="600" y1="660" x2="600" y2="676" stroke="#211d18" stroke-width="1.0" stroke-linecap="butt"/>
<text x="90" y="640" font-size="14" fill="#211d18" text-anchor="start">physical description —</text>
<text x="90" y="661" font-size="14" fill="#211d18" text-anchor="start">event, measure, position</text>
<line x1="540" y1="212" x2="540" y2="452" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="butt"/>
<line x1="660" y1="212" x2="660" y2="452" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="butt"/>
<text x="800" y="296" font-size="13.5" fill="#6f6659" text-anchor="start">the same pattern —</text>
<text x="800" y="316" font-size="13.5" fill="#6f6659" text-anchor="start">neither description reduces</text>
<text x="800" y="335" font-size="13.5" fill="#6f6659" text-anchor="start">to the other</text>
<text x="600" y="802" font-size="16" fill="#211d18" text-anchor="middle">two descriptions retained across one seam</text>
<text x="600" y="826" font-size="13.5" fill="#6f6659" text-anchor="middle" font-style="italic">the field precedes the division whose sides later disclose it differently</text>
</svg>
