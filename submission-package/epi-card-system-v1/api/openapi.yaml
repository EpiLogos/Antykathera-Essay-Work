openapi: 3.1.0
info:
  title: Epi-Card Runtime Action API
  version: 1.0.0
  description: |
    Harness-neutral adapter over the Epi-Card shared action library. This API does not
    define a second domain model. Every action request and result conforms to the same
    contracts used by the CLI, studio, tests, and Agent Skill.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Actions
  - name: Runs
  - name: Engagements
  - name: Approvals
  - name: Assets
  - name: Renditions
  - name: Projections
  - name: Public
paths:
  /actions/{actionName}:
    post:
      tags: [Actions]
      operationId: invokeAction
      summary: Invoke one registered shared action
      parameters:
        - $ref: '#/components/parameters/ActionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../contracts/action-envelope.schema.json#/$defs/request'
      responses:
        '200':
          description: Synchronous action result
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '202':
          description: Long-running action accepted
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Read the current immutable-plus-progress state of an action run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run result envelope
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/resume:
    post:
      tags: [Runs]
      operationId: resumeRun
      summary: Resume a retryable or externally waiting run from its persisted cursor
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id: {type: [string, 'null'], format: uuid}
                resume_options: {type: object}
      responses:
        '200':
          description: Resumed run completed synchronously
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '202':
          description: Resumed run is active
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /runs/{runId}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation of a cancellable run
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Run cancelled or already terminal
          content:
            application/json:
              schema:
                $ref: '../contracts/action-envelope.schema.json#/$defs/result'
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream ordered action events
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          schema: {type: integer, minimum: -1, default: -1}
      responses:
        '200':
          description: Server-Sent Events, each data field conforming to the event schema
          content:
            text/event-stream:
              schema:
                type: string
        '404': {$ref: '#/components/responses/NotFound'}
  /engagements/{engagementId}:
    get:
      tags: [Engagements]
      operationId: getEngagement
      summary: Read the engagement projection permitted by the caller's disclosure scope
      parameters:
        - $ref: '#/components/parameters/EngagementId'
        - $ref: '#/components/parameters/Disclosure'
      responses:
        '200':
          description: Engagement summary and resource links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementProjection'
        '404': {$ref: '#/components/responses/NotFound'}
  /engagements/{engagementId}/ql-frame:
    get:
      tags: [Engagements]
      operationId: getQLFrame
      summary: Read the canonical full 6+6-prime QL frame
      parameters:
        - $ref: '#/components/parameters/EngagementId'
        - $ref: '#/components/parameters/Disclosure'
      responses:
        '200':
          description: Full QL conjugate frame
          content:
            application/json:
              schema:
                $ref: '../contracts/ql-frame.schema.json'
        '404': {$ref: '#/components/responses/NotFound'}
  /engagements/{engagementId}/events:
    get:
      tags: [Engagements]
      operationId: streamEngagementEvents
      summary: Stream events from every run associated with an engagement
      parameters:
        - $ref: '#/components/parameters/EngagementId'
        - name: after
          in: query
          schema: {type: integer, minimum: -1, default: -1}
      responses:
        '200':
          description: Server-Sent Events
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /approvals:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Create an approval request or decide an existing approval gate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Approval record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Read asset metadata and an authorised content URL or package path
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Disclosure'
      responses:
        '200':
          description: Asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404': {$ref: '#/components/responses/NotFound'}
  /renditions/{renditionId}:
    get:
      tags: [Renditions]
      operationId: getRendition
      summary: Read a frozen rendition manifest
      parameters:
        - $ref: '#/components/parameters/RenditionId'
        - $ref: '#/components/parameters/Disclosure'
      responses:
        '200':
          description: Rendition manifest and assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rendition'
        '404': {$ref: '#/components/responses/NotFound'}
  /projections/{projectionId}:
    get:
      tags: [Projections]
      operationId: getProjection
      summary: Read one immutable disclosure-scoped engagement projection
      parameters:
        - $ref: '#/components/parameters/ProjectionId'
      responses:
        '200':
          description: Approved or authorised projection snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/cards/{slug}:
    get:
      tags: [Public]
      operationId: getPublicCard
      summary: Resolve an approved public projection for a QR or gallery route
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Approved public Epi-Card projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ActionName:
      name: actionName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+$'
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EngagementId:
      name: engagementId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RenditionId:
      name: renditionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectionId:
      name: projectionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 200, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 256}
    Disclosure:
      name: disclosure
      in: query
      schema:
        type: string
        enum: [private, shared, public]
        default: private
  schemas:
    Projection:
      type: object
      additionalProperties: false
      required: [id, engagement_id, projection_kind, revision_no, disclosure, source_revision_manifest, snapshot, snapshot_hash, status, created_at]
      properties:
        id: {type: string, format: uuid}
        engagement_id: {type: string, format: uuid}
        projection_kind: {type: string, enum: [private, shared, public, provider]}
        revision_no: {type: integer, minimum: 1}
        disclosure: {type: string, enum: [secret, private, shared, public]}
        provider: {type: [string, 'null']}
        purpose: {type: [string, 'null']}
        source_revision_manifest: {type: object}
        snapshot: {type: object}
        snapshot_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {type: string, enum: [draft, approved, superseded, expired]}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
    Error:
      type: object
      additionalProperties: false
      required: [error, message, request_id]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: [string, 'null'], format: uuid}
        details: {type: object}
        retryable: {type: boolean, default: false}
    EngagementProjection:
      type: object
      additionalProperties: false
      required: [id, status, attractor, ql_frame, renditions, links]
      properties:
        id: {type: string, format: uuid}
        slug: {type: [string, 'null']}
        status:
          type: string
          enum: [draft, mapping, art_direction, production, review, approved, rendered, published, returned, archived]
        attractor: {type: object}
        threshold: {type: object}
        ql_frame:
          type: string
          description: Relative URL for the full QL frame resource
        renditions:
          type: array
          items: {type: string, format: uuid}
        links: {type: object, additionalProperties: {type: string}}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [engagement_id, target_kind, target_id, approval_type, decision]
      properties:
        approval_id: {type: [string, 'null'], format: uuid}
        engagement_id: {type: string, format: uuid}
        target_kind: {type: string}
        target_id: {type: string, format: uuid}
        approval_type: {type: string}
        decision: {type: string, enum: [request, approve, reject, revoke]}
        note: {type: [string, 'null']}
    Approval:
      type: object
      required: [id, engagement_id, target_kind, target_id, approval_type, status, requested_at]
      properties:
        id: {type: string, format: uuid}
        engagement_id: {type: string, format: uuid}
        target_kind: {type: string}
        target_id: {type: string, format: uuid}
        approval_type: {type: string}
        status: {type: string, enum: [requested, approved, rejected, revoked]}
        requested_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        decision_note: {type: [string, 'null']}
    Asset:
      type: object
      additionalProperties: false
      required: [id, sha256, media_type, role, disclosure, created_at]
      properties:
        id: {type: string, format: uuid}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        media_type: {type: string}
        role: {type: string}
        disclosure: {type: string, enum: [secret, private, shared, public]}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null']}
        alpha_mode: {type: string, enum: [none, straight, premultiplied]}
        content_url: {type: [string, 'null'], format: uri}
        package_path: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    Rendition:
      type: object
      additionalProperties: false
      required: [id, engagement_id, kind, profile, revision_no, status, manifest, assets]
      properties:
        id: {type: string, format: uuid}
        engagement_id: {type: string, format: uuid}
        kind: {type: string}
        profile: {type: string}
        revision_no: {type: integer, minimum: 1}
        status: {type: string, enum: [rendering, candidate, approved, superseded, failed]}
        manifest: {type: object}
        assets:
          type: array
          items: {$ref: '#/components/schemas/Asset'}
  responses:
    BadRequest:
      description: Malformed request
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorised:
      description: Missing or invalid authentication
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Permission or disclosure failure
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource not found in the caller's disclosure scope
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: State, revision, approval, or idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unprocessable:
      description: Domain or validation failure
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
