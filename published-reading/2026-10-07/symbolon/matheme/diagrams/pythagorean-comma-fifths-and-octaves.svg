<text x="550" y="780" font-size="18" fill="#211d18" text-anchor="middle" font-style="italic">Twelve-tone equal temperament closes exactly by changing what it preserves</text>
<text x="215" y="810" font-size="15.5" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">12 steps of 2^(1/12)</text>
<text x="215" y="830" font-size="15.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">close at 2/1 exactly</text>
<text x="550" y="810" font-size="15.5" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">its fifth 2^(7/12) ≈ 1.4983</text>
<text x="550" y="830" font-size="15.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">700 cents</text>
<text x="885" y="810" font-size="15.5" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">the pure fifth 3/2</text>
<text x="885" y="830" font-size="15.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">701.955 cents</text>
<text x="550" y="864" font-size="15.5" fill="#6f6659" text-anchor="middle">the question is which relationship the tuning serves and what adjustment it makes audible</text>
