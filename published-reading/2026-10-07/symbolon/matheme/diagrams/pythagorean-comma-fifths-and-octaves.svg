<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Twelve pure fifths overshoot seven octaves by the Pythagorean comma</title>
<desc id="d">Left, the pitch-class circle, pitch reduced by whole octaves, with twelve equal steps ticked around it. Twelve pure fifths, each three halves, are plotted as a chain of points with chords; the twelfth lands a little beyond the starting point, and the red arc between them is the comma. Right, the same journey lifted to pitch height: seven octaves and twelve fifths drawn as two bars that differ by a sliver, then magnified on a ruler to show twelve fifths at 7.0196 octaves against seven octaves at exactly seven. The residual is 531441 over 524288, about 1.01364, or 23.46 cents, and it is not the whole tone nine eighths. Beneath, twelve-tone equal temperament closes exactly with twelve steps of two to the power one twelfth, its fifth being 700 cents against 701.955 for the pure fifth.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#211d18"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2f2b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6659"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e3a59"/></marker></defs>
