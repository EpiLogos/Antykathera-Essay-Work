<svg xmlns="http://www.w3.org/2000/svg" width="980" height="724" viewBox="0 0 980 724" role="img" aria-labelledby="t d">
  <title id="t">An atlas of two charts on the unit circle</title>
  <desc id="d">Left: the unit circle with its north and south poles marked as omitted points, and the sample point P at three fifths and four fifths. Right: chart u equals x over one minus y, valid away from the north pole, and chart v equals x over one plus y, valid away from the south pole, joined by the overlap rule uv equals one, v equals one over u. Below, the motion test: du dt equals two at P gives dv dt equals minus two ninths, yet both charts recover the same height speed six twenty-fifths. A closing band states that no single global chart is available.</desc>
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .tok  { font-family: "Courier New", Courier, monospace; fill: #1a1a1a; }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #1a1a1a; }
    .lab  { font-family: Georgia, "Times New Roman", serif; fill: #3d3d3d; }
    .mut  { font-family: Georgia, "Times New Roman", serif; fill: #6b6b6b; }
    .acc  { fill: #8a2a2a; }
    .card { fill: #f7f4ee; stroke: #1a1a1a; stroke-width: 1.3; }
    .cardq{ fill: #faf3f0; stroke: #8a2a2a; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="980" height="724" fill="#ffffff"/>

  <text class="lab" x="40" y="36" font-size="20" font-weight="bold">An atlas of two charts on the unit circle x&#178; + y&#178; = 1</text>
  <text class="mut" x="40" y="58" font-size="12.5">each chart is exact over an admitted domain; the joins say how one passes into another</text>

  <!-- the circle -->
  <circle cx="270" cy="360" r="180" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="270" y1="140" x2="270" y2="580" stroke="#c9c4ba" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60"  y1="360" x2="480" y2="360" stroke="#c9c4ba" stroke-width="1" stroke-dasharray="4 4"/>

  <circle cx="270" cy="180" r="5" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.8"/>
  <text class="lab acc" x="284" y="172" font-size="12.5">N &#8212; omitted from chart u</text>

  <circle cx="270" cy="540" r="5" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.8"/>
  <text class="lab acc" x="284" y="562" font-size="12.5">S &#8212; omitted from chart v</text>

  <circle cx="378" cy="216" r="6" fill="#8a2a2a"/>
  <text class="lab" x="394" y="210" font-size="13">P = (3/5, 4/5)</text>
  <text class="lab" x="394" y="227" font-size="13">u = 3,  v = 1/3</text>

  <!-- chart u card -->
  <rect class="card" x="560" y="90" width="380" height="84" rx="8"/>
  <text class="math" x="750" y="122" font-size="17" text-anchor="middle">chart u = x / (1 &#8722; y)</text>
  <text class="mut" x="750" y="146" font-size="12.5" text-anchor="middle">valid away from N; at N no finite u</text>

  <!-- overlap arrows -->
  <line x1="750" y1="174" x2="750" y2="210" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="790" y1="210" x2="790" y2="174" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr5)"/>

  <!-- chart v card -->
  <rect class="card" x="560" y="216" width="380" height="84" rx="8"/>
  <text class="math" x="750" y="248" font-size="17" text-anchor="middle">chart v = x / (1 + y)</text>
  <text class="mut" x="750" y="272" font-size="12.5" text-anchor="middle">valid away from S; at S no finite v</text>

  <!-- overlap rule -->
  <rect class="cardq" x="560" y="330" width="380" height="84" rx="8"/>
  <text class="math" x="750" y="362" font-size="17" text-anchor="middle">overlap:  uv = x&#178;/(1&#8722;y&#178;) = 1,   v = 1/u</text>
  <text class="mut" x="750" y="386" font-size="12.5" text-anchor="middle">a rule-governed translation, not a disagreement about the point</text>

  <!-- motion test -->
  <rect class="card" x="560" y="440" width="380" height="140" rx="8"/>
  <text class="lab" x="750" y="468" font-size="14" text-anchor="middle" font-weight="bold">A moving point tests the translation</text>
  <text class="math" x="750" y="496" font-size="15" text-anchor="middle">du/dt = 2 at P  &#8658;  dv/dt = &#8722;2/9</text>
  <text class="math" x="750" y="524" font-size="15" text-anchor="middle">y = (u&#178;&#8722;1)/(u&#178;+1) = (1&#8722;v&#178;)/(1+v&#178;)</text>
  <text class="math" x="750" y="552" font-size="15" text-anchor="middle" fill="#8a2a2a">dy/dt = 6/25  by either route</text>
  <text class="mut" x="750" y="572" font-size="11.5" text-anchor="middle">differently written motions answer to one moving object</text>

  <!-- bottom band -->
  <line x1="40" y1="616" x2="940" y2="616" stroke="#c9c4ba" stroke-width="1"/>
  <text class="mut" x="40" y="644" font-size="12.5">No global chart: a compact circle cannot be presented as one coordinate chart onto an open Euclidean domain.</text>
  <text class="mut" x="40" y="664" font-size="12.5">The excluded pole of each chart remains available through the other.</text>
  <text class="mut" x="40" y="684" font-size="12.5">Agreement cannot be supplied by declaring all perspectives valid; the transition rule earns it.</text>
  <text class="mut" x="40" y="704" font-size="12.5">Chart compatibility supplies no law of motion &#8212; the velocity is supplied separately.</text>
</svg>
