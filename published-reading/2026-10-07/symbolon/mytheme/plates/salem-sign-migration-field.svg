<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Plate — The Sign and Its Witnesses: the Salem Manuscript Field</title>
<desc id="d">A horizontal dotted path on a paper ground passes through four arched frames labelled "Babylonian place-holding", "Indian numerical development", "Arabic transmission" and "European adoption"; each frame contains a small solid disc. After the fourth frame the path forks. The upper branch reaches a solid arched frame labelled "apparatus — Gerbert" containing three questions in typewriter type — "numeral form?", "calculating apparatus?", "positional use?" — captioned "distinct predicates · chronology open". The lower branch reaches a dashed arched frame labelled "codex — Salem" whose interior is empty, captioned "no verified shelfmark · folio · Latin collation"; beside it a small drawn book is labelled "Cantor 1865 · ZfMP 10, 1–16 — the edition pointer", joined to the frame by a dotted line. A legend states that the disc is the plate's own token and no historical numeral form is depicted. Base inscription: "recognising a shape does not settle either operation or transmission — the empty frame is drawn empty: the pointer is recovered; the manuscript is not yet verified."</desc>
<rect x="0" y="0" width="1200" height="900" fill="#f5f0e6"/>
<text x="600" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">PLATE · THE SIGN AND ITS WITNESSES</text>
<text x="600" y="94" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">a sign migrates between worlds — its Latin manuscript witness is not recovered</text>
<line x1="70" y1="300" x2="660" y2="300" stroke="#b9ae9c" stroke-width="1.6" stroke-dasharray="1 7" stroke-linecap="round"/>
<path d="M 80 420 L 80 260 A 60 60 0 0 1 200 260 L 200 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="140" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="140" y="452" font-size="13" fill="#211d18" text-anchor="middle">Babylonian</text>
<text x="140" y="470" font-size="13" fill="#211d18" text-anchor="middle">place-holding</text>
<path d="M 230 420 L 230 260 A 60 60 0 0 1 350 260 L 350 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="290" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="290" y="452" font-size="13" fill="#211d18" text-anchor="middle">Indian numerical</text>
<text x="290" y="470" font-size="13" fill="#211d18" text-anchor="middle">development</text>
<path d="M 380 420 L 380 260 A 60 60 0 0 1 500 260 L 500 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="440" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="440" y="452" font-size="13" fill="#211d18" text-anchor="middle">Arabic</text>
<text x="440" y="470" font-size="13" fill="#211d18" text-anchor="middle">transmission</text>
<path d="M 530 420 L 530 260 A 60 60 0 0 1 650 260 L 650 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="590" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="590" y="452" font-size="13" fill="#211d18" text-anchor="middle">European</text>
<text x="590" y="470" font-size="13" fill="#211d18" text-anchor="middle">adoption</text>
<line x1="662" y1="296" x2="746" y2="245" stroke="#b9ae9c" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
<line x1="662" y1="304" x2="746" y2="540" stroke="#b9ae9c" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
<path d="M 750 335 L 750 205 A 100 100 0 0 1 950 205 L 950 335 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<text x="850" y="196" font-size="15" fill="#211d18" text-anchor="middle">apparatus — Gerbert</text>
<text x="850" y="244" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">numeral form?</text>
<text x="850" y="270" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">calculating apparatus?</text>
<text x="850" y="296" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">positional use?</text>
<text x="850" y="362" font-size="12.5" fill="#6f6659" text-anchor="middle">distinct predicates · chronology open</text>
<path d="M 750 620 L 750 520 A 100 100 0 0 1 950 520 L 950 620 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2" stroke-dasharray="8 6"/>
<text x="850" y="505" font-size="15" fill="#211d18" text-anchor="middle">codex — Salem</text>
<text x="850" y="646" font-size="12.5" fill="#6f6659" text-anchor="middle">no verified shelfmark · folio · Latin collation</text>
<line x1="954" y1="565" x2="1036" y2="565" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="butt"/>
<rect x="1040" y="523" width="60" height="84" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<line x1="1052" y1="523" x2="1052" y2="607" stroke="#211d18" stroke-width="1.4" stroke-linecap="butt"/>
<line x1="1062" y1="549" x2="1088" y2="549" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="1062" y1="563" x2="1088" y2="563" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<text x="1070" y="633" font-size="12.5" fill="#211d18" text-anchor="middle">Cantor 1865 · ZfMP 10,</text>
<text x="1070" y="651" font-size="12.5" fill="#211d18" text-anchor="middle">1–16 — the edition pointer</text>
<text x="850" y="700" font-size="13.5" fill="#6f6659" text-anchor="middle">the Latin reception — two recoveries the dossier keeps distinct</text>
<circle cx="100" cy="772" r="8" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="118" y="777" font-size="12.5" fill="#6f6659" text-anchor="start">the disc is this plate's own token for the migrating sign — no historical numeral form is depicted</text>
<text x="600" y="830" font-size="16" fill="#211d18" text-anchor="middle">recognising a shape does not settle either operation or transmission</text>
<text x="600" y="856" font-size="13.5" fill="#6f6659" text-anchor="middle" font-style="italic">the empty frame is drawn empty: the pointer is recovered; the manuscript is not yet verified</text>
</svg>
