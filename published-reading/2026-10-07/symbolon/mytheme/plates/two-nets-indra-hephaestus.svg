<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Plate — Two Technical Destinies of the Web</title>
<desc id="d">A diptych separated by a thin vertical rule. Left panel, "the jewel net, 0/1": a diagonal lattice of small diamond jewels connected by fine lines; one jewel near the lower left is filled gold with a red outline and emits faint dotted rays to its neighbours; a caption reads "each jewel reflects the others; the selected jewel remains the particular entrance". Right panel, "the artful bond, (−1)+/−(+1)": a bold rectangle filled with fine diagonal cross-hatch netting containing two circles, one solid labelled (+1) and one hollow labelled (−1), each captioned "exposed term"; twelve dark dots form a ring around the mesh, captioned "the convened tribunal — a zero occupied from outside"; one red dot stands apart at the lower left with a dashed red line to the mesh, captioned "the one who does not laugh — release from inside the loss". Motto beneath both panels: "mutual visibility is not entrusted continuation".</desc>
<rect x="0" y="0" width="1200" height="900" fill="#f5f0e6"/>
<text x="600" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">PLATE · TWO TECHNICAL DESTINIES OF THE WEB</text>
<text x="600" y="94" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">the jewel net and the artful bond — two operations neither can lend the other</text>
<line x1="600" y1="130" x2="600" y2="830" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<text x="310" y="148" font-size="17" fill="#211d18" text-anchor="middle">the jewel net</text>
<text x="310" y="176" font-size="20" fill="#211d18" text-anchor="middle" font-family="'Courier New', Courier, monospace">0/1</text>
<text x="310" y="198" font-size="12.5" fill="#6f6659" text-anchor="middle">relation internally active in every determination</text>
