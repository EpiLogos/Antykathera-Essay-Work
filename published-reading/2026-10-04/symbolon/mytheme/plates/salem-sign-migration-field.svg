<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, 'Times New Roman', serif" role="img">
<rect x="0" y="0" width="1200" height="900" fill="#f5f0e6"/>
<text x="600" y="64" font-size="20" fill="#211d18" text-anchor="middle" letter-spacing="4">PLATE · THE SIGN AND ITS WITNESSES</text>
<text x="600" y="94" font-size="15" fill="#6f6659" text-anchor="middle" font-style="italic">a sign migrates between worlds — its Latin manuscript witness is not recovered</text>
<line x1="70" y1="300" x2="660" y2="300" stroke="#b9ae9c" stroke-width="1.6" stroke-dasharray="1 7" stroke-linecap="round"/>
<path d="M 80 420 L 80 260 A 60 60 0 0 1 200 260 L 200 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="140" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="140" y="452" font-size="13" fill="#211d18" text-anchor="middle">Babylonian</text>
<text x="140" y="470" font-size="13" fill="#211d18" text-anchor="middle">place-holding</text>
<path d="M 230 420 L 230 260 A 60 60 0 0 1 350 260 L 350 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="290" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="290" y="452" font-size="13" fill="#211d18" text-anchor="middle">Indian numerical</text>
<text x="290" y="470" font-size="13" fill="#211d18" text-anchor="middle">development</text>
<path d="M 380 420 L 380 260 A 60 60 0 0 1 500 260 L 500 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="440" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="440" y="452" font-size="13" fill="#211d18" text-anchor="middle">Arabic</text>
<text x="440" y="470" font-size="13" fill="#211d18" text-anchor="middle">transmission</text>
<path d="M 530 420 L 530 260 A 60 60 0 0 1 650 260 L 650 420 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<circle cx="590" cy="340" r="13" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="590" y="452" font-size="13" fill="#211d18" text-anchor="middle">European</text>
<text x="590" y="470" font-size="13" fill="#211d18" text-anchor="middle">adoption</text>
<line x1="662" y1="296" x2="772" y2="252" stroke="#b9ae9c" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
<line x1="662" y1="304" x2="772" y2="495" stroke="#b9ae9c" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
<path d="M 775 345 L 775 185 A 75 75 0 0 1 925 185 L 925 345 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<text x="850" y="165" font-size="15" fill="#211d18" text-anchor="middle">apparatus — Gerbert</text>
<text x="850" y="247" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">numeral form?</text>
<text x="850" y="273" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">calculating apparatus?</text>
<text x="850" y="299" font-size="12.5" fill="#6f6659" text-anchor="middle" font-family="'Courier New', Courier, monospace">positional use?</text>
<text x="850" y="375" font-size="12.5" fill="#6f6659" text-anchor="middle">distinct predicates · chronology open</text>
<path d="M 790 595 L 790 435 A 60 60 0 0 1 910 435 L 910 595 Z" fill="#f5f0e6" stroke="#211d18" stroke-width="2" stroke-dasharray="8 6"/>
<text x="850" y="419" font-size="15" fill="#211d18" text-anchor="middle">codex — Salem</text>
<text x="850" y="621" font-size="12.5" fill="#6f6659" text-anchor="middle">no verified shelfmark · folio · Latin collation</text>
<line x1="927" y1="515" x2="986" y2="520" stroke="#b9ae9c" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="butt"/>
<rect x="990" y="481" width="60" height="84" fill="#f5f0e6" stroke="#211d18" stroke-width="2"/>
<line x1="1002" y1="481" x2="1002" y2="565" stroke="#211d18" stroke-width="1.4" stroke-linecap="butt"/>
<line x1="1012" y1="507" x2="1038" y2="507" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="1012" y1="521" x2="1038" y2="521" stroke="#b9ae9c" stroke-width="1.2" stroke-linecap="butt"/>
<text x="1020" y="591" font-size="12.5" fill="#211d18" text-anchor="middle">Cantor 1865 · ZfMP 10,</text>
<text x="1020" y="609" font-size="12.5" fill="#211d18" text-anchor="middle">1–16 — the edition pointer</text>
<text x="890" y="672" font-size="13.5" fill="#6f6659" text-anchor="middle">the Latin reception — two recoveries the dossier keeps distinct</text>
<circle cx="100" cy="772" r="8" fill="#211d18" stroke="none" stroke-width="0"/>
<text x="118" y="777" font-size="12.5" fill="#6f6659" text-anchor="start">the disc is this plate's own token for the migrating sign — no historical numeral form is depicted</text>
<text x="600" y="830" font-size="16" fill="#211d18" text-anchor="middle">recognising a shape does not settle either operation or transmission</text>
<text x="600" y="856" font-size="13.5" fill="#6f6659" text-anchor="middle" font-style="italic">the empty frame is drawn empty: the pointer is recovered; the manuscript is not yet verified</text>
</svg>
