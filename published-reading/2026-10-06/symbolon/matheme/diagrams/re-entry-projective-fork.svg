<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="t d">
  <title id="t">Re-entry and the projective fork, placed as comparative adjacency</title>
  <desc id="d">Two side-by-side panels divided by a dashed line labelled comparative adjacency, not equivalence. Left: a circle split by a mark with an arrow re-entering the form, above the iterant derivation in which alternation plus temporal shift yields i squared equals minus one. Right: the two projective-line charts u equals x over y and v equals y over x, with crossing arrows showing that the coordinate each chart blocks the other supplies, joined by the overlap rule v equals one over u.</desc>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2a2a"/>
    </marker>
  </defs>
  <style>
    .tok  { font-family: "Courier New", Courier, monospace; fill: #1a1a1a; }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #1a1a1a; }
    .lab  { font-family: Georgia, "Times New Roman", serif; fill: #3d3d3d; }
    .mut  { font-family: Georgia, "Times New Roman", serif; fill: #6b6b6b; }
    .acc  { fill: #8a2a2a; }
    .card { fill: #f7f4ee; stroke: #1a1a1a; stroke-width: 1.3; }
  </style>

  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- central divider -->
  <line x1="490" y1="30" x2="490" y2="500" stroke="#8a2a2a" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text class="lab acc" x="508" y="436" font-size="13.5" font-weight="bold">comparative adjacency &#8212;</text>
  <text class="lab acc" x="508" y="455" font-size="13.5" font-weight="bold">not equivalence</text>

  <!-- LEFT PANEL: mark and re-entry -->
  <text class="lab" x="40" y="44" font-size="18" font-weight="bold">Mark and re-entry</text>
  <text class="mut" x="40" y="64" font-size="12.5">Spencer-Brown&#8217;s distinction &#183; Kauffman&#8217;s iterants</text>

  <circle cx="160" cy="185" r="82" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="160" y1="103" x2="160" y2="267" stroke="#1a1a1a" stroke-width="2.4"/>
  <text class="mut" x="150" y="160" font-size="12" text-anchor="end">inside</text>
  <text class="mut" x="170" y="160" font-size="12">outside</text>
  <text class="lab" x="160" y="292" font-size="13.5" text-anchor="middle">the mark creates inside</text>
  <text class="lab" x="160" y="310" font-size="13.5" text-anchor="middle">and outside together</text>

  <path d="M 258 140 C 320 96, 342 150, 306 196 C 288 220, 246 224, 214 208" fill="none" stroke="#8a2a2a" stroke-width="2" marker-end="url(#arr3a)"/>
  <text class="lab acc" x="330" y="120" font-size="12.5">the mark re-enters</text>
  <text class="lab acc" x="330" y="136" font-size="12.5">its own form</text>

  <rect class="card" x="40" y="330" width="410" height="118" rx="8"/>
  <text class="math" x="245" y="362" font-size="17" text-anchor="middle">[+1, &#8722;1, +1, &#8722;1, &#8230;]  +  shift &#951;</text>
  <text class="math" x="245" y="392" font-size="17" text-anchor="middle">(D&#951;)&#178; = &#8722;I  &#8658;  i&#178; = &#8722;1</text>
  <text class="mut" x="245" y="420" font-size="12.5" text-anchor="middle">the imaginary unit as alternation plus temporal shift</text>

  <text class="lab" x="40" y="478" font-size="13">the re-entering mark carries its prior crossing into the next state</text>
  <text class="lab" x="40" y="496" font-size="13">as memory (Argued): the return arrives with transformed phase</text>

  <!-- RIGHT PANEL: projective fork -->
  <text class="lab" x="530" y="44" font-size="18" font-weight="bold">The projective fork</text>
  <text class="mut" x="530" y="64" font-size="12.5">real projective line: points [x:y], nonzero scalars identified</text>

  <g>
    <rect class="card" x="530" y="96" width="196" height="120" rx="8"/>
    <text class="tok" x="628" y="122" font-size="15" text-anchor="middle" font-weight="bold">[0:1]</text>
    <text class="math" x="628" y="148" font-size="14" text-anchor="middle">u = x/y  &#8614;  0</text>
    <text class="mut" x="628" y="172" font-size="12" text-anchor="middle">valid where y &#8800; 0</text>
    <text class="acc" x="628" y="196" font-size="12" text-anchor="middle">[1:0] blocked</text>

    <rect class="card" x="744" y="96" width="196" height="120" rx="8"/>
    <text class="tok" x="842" y="122" font-size="15" text-anchor="middle" font-weight="bold">[1:0]</text>
    <text class="math" x="842" y="148" font-size="14" text-anchor="middle">v = y/x  &#8614;  0</text>
    <text class="mut" x="842" y="172" font-size="12" text-anchor="middle">valid where x &#8800; 0</text>
    <text class="acc" x="842" y="196" font-size="12" text-anchor="middle">[0:1] blocked</text>

    <line x1="728" y1="136" x2="742" y2="136" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr3)"/>
    <line x1="742" y1="176" x2="728" y2="176" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text class="mut" x="735" y="238" font-size="12" text-anchor="middle">each chart supplies the coordinate the other blocks</text>
  </g>

  <rect class="card" x="530" y="248" width="410" height="72" rx="8"/>
  <text class="math" x="735" y="278" font-size="17" text-anchor="middle">overlap:  uv = 1,   v = 1/u</text>
  <text class="mut" x="735" y="302" font-size="12.5" text-anchor="middle">the zero belongs to the new chart &#8212; not a multiplicative inverse of zero</text>

  <text class="lab" x="530" y="356" font-size="13">the affine obstruction ([1:0] has no finite u) is answered by</text>
  <text class="lab" x="530" y="374" font-size="13">completing the representational space, not by revaluing zero</text>

  <!-- bottom band -->
  <line x1="40" y1="516" x2="940" y2="516" stroke="#c9c4ba" stroke-width="1"/>
  <text class="mut" x="40" y="542" font-size="12">Re-entry calculus and projective completion are distinct constructions, placed beside the native fork for the operation each performs.</text>
  <text class="mut" x="40" y="560" font-size="12">Adjacency asserts no identity between panels and no equivalence with 0/1 and 1/0.</text>
</svg>
