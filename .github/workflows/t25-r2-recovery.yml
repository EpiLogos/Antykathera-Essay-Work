name: T25 R2 original recovery and R1 baseline repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r2-recovery.yml']

permissions:
  contents: write

concurrency:
  group: t25-canonical-admission
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify original custody, rebuild, and test the admitted baseline
        shell: bash
        run: |
          python3 -m pip install PyYAML
          python3 working/pre-manuscript-refinement-2026-09-10/recovery/validate-baseline.py "$RUNNER_TEMP/t25-recovery"
      - name: Fast-forward only the validated generated tree
        shell: bash
        run: |
          set -euo pipefail
          expected=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/t25-recovery/baseline-validation.json"))["tested_tree"])')
          test "$(git write-tree)" = "$expected"
          test -z "$(git diff --name-only)"
          if ! git diff --cached --quiet; then
            git config user.name 'Epii'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'T25 recovery: rebuild projections for the admitted R1 baseline'
            test "$(git rev-parse 'HEAD^{tree}')" = "$expected"
            git push origin HEAD:main
          fi
          git log -1 --format='published_commit=%H%npublished_tree=%T' | tee "$RUNNER_TEMP/t25-recovery/published.txt"
      - name: Retain exact validation and the original-custody inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t25-r2-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/t25-recovery/
          retention-days: 7
          if-no-files-found: error
