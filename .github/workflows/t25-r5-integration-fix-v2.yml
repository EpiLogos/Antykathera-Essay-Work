name: T25 R5 corrected reader and product-field integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r5-integration-fix-v2.yml']

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - run: python3 -m pip install PyYAML

      - name: Apply the complete bounded R5 integration repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Live admission and navigation contracts.
          replace_once('tools/audit-reader-navigation.py',
              'RECEIPT = Path("working/p2-enrichment/receipts/T20-T21-current-census-acceptance.json")',
              'RECEIPT = Path("working/pre-manuscript-refinement-2026-09-10/T25-current-census-acceptance.json")')

          p=Path('tools/build-navigation.py'); text=p.read_text(encoding='utf-8')
          needle='    ("episteme-concepts", "Episteme · Concepts C01–C64 and provenance", "#4", "submission-package/essay/symbolon/episteme/concepts/README.md"),\n'
          addition='    ("episteme-products", "Episteme · Product field S / S0–S5", "#4", "submission-package/essay/symbolon/episteme/products/README.md"),\n'
          if addition not in text:
              if needle not in text: raise SystemExit('navigation insertion point missing')
              text=text.replace(needle,needle+addition,1)
          text=text.replace('BUILDER_VERSION = "1.1.0"','BUILDER_VERSION = "1.1.1"',1)
          p.write_text(text,encoding='utf-8')

          # Product/product-field metadata is part of the canonical graph.
          p=Path('tools/okf-workspace.py'); text=p.read_text(encoding='utf-8')
          old='''        expandable = {\n            "section",\n            "argument",\n            "argument-map",\n            "concept",\n            "room-reading-path",\n        }'''
          new='''        expandable = {\n            "section",\n            "argument",\n            "argument-map",\n            "concept",\n            "product",\n            "product-field",\n            "room-reading-path",\n        }'''
          if old not in text: raise SystemExit('product expansion insertion point missing')
          text=text.replace(old,new,1)
          marker='''            for argument_id in consumed_by_arguments:\n                edge = self._edge(\n                    artifact,\n                    str(argument_id),\n                    "consumed-by",\n                    "consumed_by_arguments",\n                    preferred="argument",\n                )\n                key = (edge.target, edge.raw_target, edge.relation)\n                if key not in seen:\n                    seen.add(key)\n                    edges.append(edge)\n\n'''
          if marker not in text: raise SystemExit('product-edge insertion point missing')
          injection=marker+'''            for field_name, preferred in (("argument_relations", "argument"), ("concept_relations", "concept")):\n                declared = artifact.frontmatter.get(field_name) or []\n                if isinstance(declared, str):\n                    declared = [declared]\n                for declared_id in declared:\n                    edge = self._edge(artifact, str(declared_id), "related", field_name, preferred=preferred)\n                    key = (edge.target, edge.raw_target, edge.relation)\n                    if key not in seen:\n                        seen.add(key)\n                        edges.append(edge)\n\n            product_parent = artifact.frontmatter.get("product_parent")\n            if product_parent:\n                edge = self._edge(artifact, str(product_parent), "member-of", "product_parent", preferred="product-field")\n                key = (edge.target, edge.raw_target, edge.relation)\n                if key not in seen:\n                    seen.add(key)\n                    edges.append(edge)\n\n            members = artifact.frontmatter.get("members") or []\n            if isinstance(members, str):\n                members = [members]\n            for member in members:\n                edge = self._edge(artifact, str(member), "has-member", "members", preferred="product")\n                key = (edge.target, edge.raw_target, edge.relation)\n                if key not in seen:\n                    seen.add(key)\n                    edges.append(edge)\n\n'''
          text=text.replace(marker,injection,1)
          old_ctx='''            "source_notes": of_type("source-notes"),\n            "passages": passages,'''
          new_ctx='''            "source_notes": of_type("source-notes"),\n            "products": of_type("product"),\n            "product_fields": of_type("product-field"),\n            "passages": passages,'''
          if old_ctx not in text: raise SystemExit('context insertion point missing')
          text=text.replace(old_ctx,new_ctx,1)
          p.write_text(text,encoding='utf-8')

          # Real reader-return routes for the six new source houses.
          returns={
           'submission-package/essay/symbolon/episteme/sources/indian-philosophy/muller-ortega/muller-ortega-1998-abhinavagupta/SOURCE.md':(
            'No quotation is admitted from this source. The title and article metadata supply the chronology used here; prose use should paraphrase.',
            'No quotation is admitted from this source. The title and article metadata supply the chronology used here; prose use should paraphrase.\n\n**Reader return:** this chronology is consumed linearly in [[section-rooms/02-return-of-zero/movements/14-s1-p1-sunya-operational|M14 — Śūnya Becomes Operational]].'),
           'submission-package/essay/symbolon/episteme/sources/mathematics-logic/bhaskara/scharf-2010-bijaganita-digital/SOURCE.md':(
            'No quotation from the mathematical body is admitted through this record. Use the Colebrooke source house for verified English passages.',
            'No quotation from the mathematical body is admitted through this record. Use the Colebrooke source house for verified English passages.\n\n**Reader return:** the 1150 chronology is consumed linearly in [[section-rooms/02-return-of-zero/movements/14-s1-p1-sunya-operational|M14 — Śūnya Becomes Operational]].'),
           'submission-package/essay/symbolon/episteme/sources/internal-corpus/taylor/chat-logs/taylor-2026-oi-product-field-commission/SOURCE.md':(
            'Use this source to establish **authorial intention, wording, product identity, pair assignment and execution authority**. Do not cite it publicly for claims about Abhinavagupta, zero, Gebser, machine learning, software behaviour or any other external subject. Those claims retain their own evidential relations and source readiness.',
            'Use this source to establish **authorial intention, wording, product identity, pair assignment and execution authority**. Do not cite it publicly for claims about Abhinavagupta, zero, Gebser, machine learning, software behaviour or any other external subject. Those claims retain their own evidential relations and source readiness.\n\n**Reader return:** the commissioned six-product field enters the linear essay at [[section-rooms/06-objective-internality/movements/37-s5-p0-math-moves-meaning|M37 — Central — Meaningful Continuity]] after M36 prepares the paired disclosure.'),
           'submission-package/essay/symbolon/episteme/sources/language-philology/lewis-short/lewis-short-proicio/SOURCE.md':(
            'No extended lexicon wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.',
            'No extended lexicon wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.\n\n**Reader return:** the thrown-forth Projecthood relation becomes technically concrete in [[section-rooms/06-objective-internality/movements/40-s5-p3-preference-hidden-zero|M40 — Software Factory — Transformation]].'),
           'submission-package/essay/symbolon/episteme/sources/language-philology/liddell-scott-jones/lsj-genesis/SOURCE.md':(
            'No extended LSJ wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.',
            'No extended LSJ wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.\n\n**Reader return:** Genesis returns vocationally in [[section-rooms/07-instrument-returns/movements/43-s50-p0-theory-vocation-compassion|M43 — From Theory to Vocation]].'),
           'submission-package/essay/symbolon/episteme/sources/language-philology/liddell-scott-jones/lsj-paradeigma-paradeiknumi/SOURCE.md':(
            'No extended LSJ wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.',
            'No extended LSJ wording is admitted as a quotation in manuscript prose through this record; paraphrase the lexical senses and cite the digital entry if needed.\n\n**Reader return:** paradigm first becomes explicit in the linear argument at [[section-rooms/01-differentiating-mind/movements/12-s0-p5-objective-internality|M12 — Objective Internality]].'),
          }
          for path,(a,b) in returns.items(): replace_once(path,a,b)

          # The paradigmatic whole itself must return visibly to the linear argument.
          replace_once(
            'submission-package/essay/symbolon/episteme/etymologies/genesis-paradigm-project-epilogos/WHOLE-FIELD.md',
            'This whole field should be consumed by exact operation. A bare `Paradigm` link is not evidence that the relation has been recovered.',
            '**Linear returns:** paradigmatic mediation first becomes explicit in [[section-rooms/01-differentiating-mind/movements/12-s0-p5-objective-internality|M12 — Objective Internality]], returns vocationally in [[section-rooms/07-instrument-returns/movements/43-s50-p0-theory-vocation-compassion|M43 — From Theory to Vocation]], and closes as paradigm-level Return in [[section-rooms/07-instrument-returns/movements/48-s50-p5-ahi-planetary-return|M48 — AHI and Planetary Return]].\n\nThis whole field should be consumed by exact operation. A bare `Paradigm` link is not evidence that the relation has been recovered.'
          )

          # Repair the matrix's relative link from quilt/ into the canonical whole.
          replace_once(
            'submission-package/essay/quilt/agentworld-response-matrix.md',
            '[Genesis / Paradigm / Project / Epi-Logos whole](symbolon/episteme/etymologies/genesis-paradigm-project-epilogos/WHOLE-FIELD.md)',
            '[Genesis / Paradigm / Project / Epi-Logos whole](../symbolon/episteme/etymologies/genesis-paradigm-project-epilogos/WHOLE-FIELD.md)'
          )

          # M26 has a real warrant; make that surface explicit for the quality contract.
          replace_once(
            'submission-package/essay/section-rooms/04-mathematical-substrate/movements/26-s3-p1-spanda-4-2.md',
            '## Harmonic reading — exact ratios, interpreted relation',
            '## Warrant — harmonic reading: exact ratios, interpreted relation'
          )

          # Test expectations displaced by the commissioned S family.
          replace_once('tests/test_publication_architecture.py','            "dialogues",\n        },','            "dialogues",\n            "products",\n        },')
          replace_once('tests/test_submission_package.py','            181,\n            len(list((ESSAY / "symbolon/episteme/sources").rglob("SOURCE.md"))),','            187,\n            len(list((ESSAY / "symbolon/episteme/sources").rglob("SOURCE.md"))),')
          replace_once('tests/test_pre_manuscript_gate.py','        self.assertEqual(281, len(rows))','        self.assertEqual(288, len(rows))')
          replace_once('tests/test_pre_manuscript_gate.py',
            "        suite = {f'C{i:02}' for i in range(1,65)} | {f'A{i:02}' for i in range(1,37)} | {f'A{i:02}p' for i in range(1,37)} | {'A/C'}",
            "        suite = ({f'C{i:02}' for i in range(1,65)} | {f'A{i:02}' for i in range(1,37)} | {f'A{i:02}p' for i in range(1,37)} | {'A/C'} | {'S','S0','S1','S2','S3','S4','S5'})")
          replace_once('tests/test_okf_workspace.py',
            '            "submission-package/essay/section-rooms/06-objective-internality/movements/39-s5-p2-j-space.md",\n            paths,',
            '            "submission-package/essay/symbolon/episteme/products/S1-Actuation.md",\n            paths,')
          replace_once('tests/test_okf_workspace.py',
            '        self.assertIn("j-space", {node["id"] for node in result["concepts"]})\n        self.assertIn("A14-Computational-Process-Ontology", {node["id"] for node in result["arguments"]})\n        self.assertIn(\n            "lecun-et-al-2006-energy-based-learning",\n            {node["id"] for node in result["sources"]},\n        )',
            '        self.assertIn("C41-Objective-Internality", {node["id"] for node in result["concepts"]})\n        self.assertIn("A26-Objective-Internality-Mind-as-Worldhood", {node["id"] for node in result["arguments"]})\n        self.assertIn(\n            "taylor-2026-oi-product-field-commission",\n            {node["id"] for node in result["sources"]},\n        )')
          PY

      - name: Generate live T25 receipt and projections
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-t25-refinement-admission.py
          python3 tools/build-source-projections.py
          python3 tools/build-section-rooms.py
          python3 tools/build-navigation.py

      - name: Prove the new reader contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-t25-refinement-admission.py --check
          python3 tools/build-source-projections.py --check
          python3 tools/build-section-rooms.py --check
          python3 tools/build-navigation.py --check
          python3 -m unittest tests.test_pre_manuscript_gate tests.test_publication_architecture tests.test_submission_package tests.test_okf_workspace tests.test_build_navigation -v
          python3 tools/audit-reader-navigation.py --project-root . --output "$RUNNER_TEMP/r5-reader.json"
          python3 - <<'PY'
          import json, os, pathlib
          r=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'r5-reader.json'))
          protected={'NOTES.md','AUTHORIAL-TEXT.md','HISTORY.md','READING.md','SCRATCH.md','SOURCE-TEMPLATE.md'}
          dead=[p for p in r['no_visible_path_to_movement'] if '/concepts/reference-notes/' not in p and pathlib.Path(p).name not in protected]
          print('reader counts:', r['counts'])
          print('visible dead ends:', dead)
          if dead: raise SystemExit('visible reader dead ends remain')
          if r['counts']['admitted'] != 288 or r['counts']['missing_admitted'] or r['counts']['unreachable_admitted']:
              raise SystemExit(f'admission/reader failure: {r["counts"]}')
          PY
          git diff --check

      - name: Commit only after the stronger contract passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-reader-navigation.py tools/build-navigation.py tools/okf-workspace.py \
            working/pre-manuscript-refinement-2026-09-10/T25-current-census-acceptance.json \
            submission-package/essay/symbolon/episteme/sources \
            submission-package/essay/symbolon/episteme/etymologies/genesis-paradigm-project-epilogos/WHOLE-FIELD.md \
            submission-package/essay/quilt/agentworld-response-matrix.md \
            submission-package/essay/symbolon/episteme/maps/navigation \
            submission-package/essay/section-rooms \
            tests/test_publication_architecture.py tests/test_submission_package.py tests/test_pre_manuscript_gate.py tests/test_okf_workspace.py
          git diff --cached --check
          git commit -m 'T25 R5: integrate S field into live reader contract'
          git push origin HEAD:main
