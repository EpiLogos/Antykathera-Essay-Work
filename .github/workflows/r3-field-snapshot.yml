name: Canonical recovery field snapshot

# Capture the post-movement-repair field for the 2026-09-27 semantic-depth continuation.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r3-field-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Test recovery detector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery/reports"
          python3 -m unittest discover -s tests -p test_canonical_argument_recovery_audit.py -v 2>&1 | tee "$RUNNER_TEMP/recovery/reports/detector-tests.txt"
      - name: Census the public field without claiming semantic acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery/reports"
          python3 tools/audit-canonical-argument-recovery.py --json > "$RUNNER_TEMP/recovery/reports/whole-field.json"
      - name: Strict checks for the source-led concept batch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit-canonical-argument-recovery.py --strict --json \
            --path submission-package/essay/symbolon/episteme/concepts/C11-Quaternal-Logic.md \
            --path submission-package/essay/symbolon/episteme/concepts/C35-Selfing-Self-Subjectivity-Self-Thing.md \
            --path submission-package/essay/symbolon/episteme/concepts/C43-Computational-Vimarsa.md \
            --path submission-package/essay/symbolon/episteme/concepts/C50-Dia-Syn.md \
            --path submission-package/essay/symbolon/episteme/concepts/C61-Symbolon-Disclosure-Architecture.md \
            > "$RUNNER_TEMP/recovery/reports/source-led-concepts.json"
      - name: Preserve exact tracked text for source and link validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovery'
          checkout = out / 'checkout'
          checkout.mkdir(parents=True, exist_ok=True)
          allowed = {'.md', '.py', '.json', '.toml', '.yaml', '.yml', '.txt', '.bib'}
          manifest = {}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in files:
              if not name:
                  continue
              source = root / name
              if source.is_symlink() or not source.is_file() or source.suffix.lower() not in allowed:
                  continue
              target = checkout / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              data = source.read_bytes()
              manifest[name] = {'sha256': hashlib.sha256(data).hexdigest(),
                                'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          (out / 'HEAD.txt').write_text(commit + '\n')
          (out / 'TEXT-MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          # Tar preserves the author's filenames; artifact uploads reject quotes and colons.
          with tarfile.open(out / 'tracked-text.tar.gz', 'w:gz') as archive:
              archive.add(checkout, arcname='checkout')
          shutil.rmtree(checkout)
          for report in (out / 'reports').glob('*.json'):
              data = json.loads(report.read_text())
              print(report.name, {k: data.get(k) for k in ('files', 'errors', 'review_candidates')})
          print('snapshot', commit, 'tracked text files', len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 2
          if-no-files-found: error
