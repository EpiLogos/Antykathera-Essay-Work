name: R3 canonical field snapshot
# Capture the current field for the 2026-10-04 Kaplan emptiness-fullness integration.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/r3-field-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Package the exact R3 semantic field
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-field"
          cp -R submission-package/essay/section-rooms/arguments "$RUNNER_TEMP/r3-field/"
          cp working/pre-manuscript-refinement-2026-09-10/R3-*.md "$RUNNER_TEMP/r3-field/" || true
          printf '%s\n' "${{ github.sha }}" > "$RUNNER_TEMP/r3-field/HEAD.txt"
          find "$RUNNER_TEMP/r3-field" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r3-field/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: r3-field-${{ github.sha }}
          path: ${{ runner.temp }}/r3-field/
          retention-days: 2
          if-no-files-found: error
