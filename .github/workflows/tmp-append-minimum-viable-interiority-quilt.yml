name: Temporary Minimum Viable Interiority quilt append

on:
  push:
    branches:
      - source/minimum-viable-interiority
    paths:
      - .github/workflows/tmp-append-minimum-viable-interiority-quilt.yml

permissions:
  contents: write

jobs:
  append-quilt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: source/minimum-viable-interiority
          fetch-depth: 0

      - name: Append reviewed contribution idempotently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('submission-package/essay/quilt/27-07-26-QUILTING-FOR-FULL-ARGUMENT.md')
          payload = Path('working/2026-08-18-MINIMUM-VIABLE-INTERIORITY-QUILT-APPEND.md')
          marker = 'session-20260818-minimum-viable-interiority'

          current = target.read_text(encoding='utf-8')
          if marker not in current:
              addition = payload.read_text(encoding='utf-8').strip()
              target.write_text(current.rstrip() + '\n\n' + addition + '\n', encoding='utf-8')
              print('Appended Minimum Viable Interiority contribution.')
          else:
              print('Contribution already present; no duplicate append.')

          if payload.exists():
              payload.unlink()
          PY

      - name: Commit append and remove staging payload
        shell: bash
        run: |
          git config user.name "EpiLogos quilt append"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A submission-package/essay/quilt/27-07-26-QUILTING-FOR-FULL-ARGUMENT.md working/2026-08-18-MINIMUM-VIABLE-INTERIORITY-QUILT-APPEND.md
          if git diff --cached --quiet; then
            echo "No append changes to commit."
          else
            git commit -m "Append Minimum Viable Interiority quilt contribution"
            git push origin HEAD:source/minimum-viable-interiority
          fi
