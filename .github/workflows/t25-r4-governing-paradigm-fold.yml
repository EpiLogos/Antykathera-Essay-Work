name: T25 R4 governing paradigm closure

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r4-governing-paradigm-fold.yml']

permissions:
  contents: write

jobs:
  close:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconcile R4 receipts and final Bimba wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one needle, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Last pre-paradigm fossil in the central plan's old-operation table.
          replace_once(
              'the-return-of-zero-central-plan.md',
              'M41 / Workcell: resistant encounter; M42 / QL: chart transitions; Bimba remains Original',
              'M41 / Workcell: resistant encounter; M42 / QL: chart transitions; a local Bimba may hold a real bounded reference/original office while remaining Pratibimba toward wider sources',
          )

          # The R4 ledger must match the actual second-pass movement state.
          ledger = 'working/pre-manuscript-refinement-2026-09-10/R4-MOVEMENT-REVIEW-25-48.md'
          replace_once(
              ledger,
              '**REFINE** — psychic-fact return strengthened; stale two-modality culmination replaced by six offices.',
              '**REFINE** — psychic-fact return strengthened; stale two-modality culmination replaced by six offices; paradigm crisis/paradox made explicit on the September 16 delta reread.',
          )
          replace_once(
              ledger,
              'PRESERVE — paired-product handoff already landed.',
              '**REFINE** — paired-product handoff retained; six pairs made explicit as disclosures of one constructed paradigm, Prompt Thrownness raised to agent-within-world, and inspectability separated from Epi-Logos.',
          )

          # Close R4 now that the governing plan and venue matrix have received the delta.
          ticket = '.wayfinder/tickets/refine-04-section-flow.md'
          replace_once(ticket, 'status: in_progress', 'status: complete')
          replace_once(ticket, 'updated: 2026-09-16', 'updated: 2026-09-16\ncompleted: 2026-09-16')
          replace_once(
              ticket,
              '**Remaining venue/governing debt:** the canonical Agentworld Response Matrix still speaks chiefly in its older QL-grammar/MEF-inspectability formulation, while the new return correctly makes the design object **agent-within-a-paradigmatically structured world**. The central plan likewise still needs the concise top-level Paradigm / Project / Epi-Logos governing relation. Those are R4 governing-surface repairs, not reasons to reopen R3.',
              '**Governing-surface closure:** the central plan now carries the explicit Genesis / Paradigm / Project / Epi-Logos compression, contextual/local Bimba reference office and six-product-paradigm boundary; the canonical Agentworld Response Matrix now carries agent-within-a-paradigmatically-structured-world as the stronger venue-facing design object. R4 is complete. R5 is the active independent cold-review/validation gate; T26 ratification remains untouched.',
          )

          receipt = 'working/pre-manuscript-refinement-2026-09-10/R4-PARADIGM-DELTA-REVIEW-2026-09-16.md'
          replace_once(
              receipt,
              'R3 stays closed. R4\'s philosophical movement bodies are now coherent with the new archaeology after the M35/M36 repairs. The remaining work is governing-surface propagation into the **central plan** and **canonical Agentworld Response Matrix**, followed by ordinary R4/R5 projection validation. Those are not new conceptual discoveries; they are prevention of regression in the two documents future passes are instructed to trust.',
              'R3 stays closed. R4\'s philosophical movement bodies are coherent with the new archaeology after the M35/M36 repairs. The **central plan**, **Orienting Principles** and **canonical Agentworld Response Matrix** now carry the same paradigmatic relation, including the contextual/local Bimba reference office and the distinction between disclosure architecture and Epi-Logos. The R3/R4 paradigm delta is therefore closed. R5 remains the independent semantic/executable validation gate; no T26 ratification is implied.',
          )

          # Move the execution map to the honest next gate.
          m = '.wayfinder/maps/p2-enrichment-handoff.md'
          replace_once(
              m,
              'status: "T25 R1–R3 complete; R4 eight-station / 48-movement review is the execution frontier"',
              'status: "T25 R1–R4 complete; R5 cold semantic and executable validation is the execution frontier"',
          )
          replace_once(
              m,
              'updated: 2026-09-15',
              'updated: 2026-09-16',
          )
          replace_once(
              m,
              'completed_through: "T25 R3 — full 144-record shared-field refinement and register fold-back"',
              'completed_through: "T25 R4 — full eight-station / 48-movement flow review with paradigmatic delta folded into governing surfaces"',
          )
          replace_once(
              m,
              '**R1–R3 are now complete.** R1 recovered the governing Life/Mind, A/C and native-theorem ground and amended the plan. R2 developed the seven-record S field, exact paired-MEF disclosure and six-product §5, including the wider Projecthood relation in Factory. R3 read and dispositioned the full `36 A + 36 A′ + 64 C + A/C + 7 S = 144` shared field and folded the restored whole back through its actual owners. The compact closing evidence is [R3 — 144-record shared-field disposition](../../working/pre-manuscript-refinement-2026-09-10/R3-144-RECORD-DISPOSITION.md).',
              '**R1–R4 are now complete.** R1 recovered the governing Life/Mind, A/C and native-theorem ground and amended the plan. R2 developed the seven-record S field, exact paired-MEF disclosure and six-product §5, including the wider Projecthood relation in Factory. R3 read and dispositioned the full `36 A + 36 A′ + 64 C + A/C + 7 S = 144` shared field and folded the restored whole back through its actual owners. R4 then read all eight stations / forty-eight movement bodies in order and performed a final Genesis / Paradigm / Project / Epi-Logos delta reread. The compact evidence is [R3 — 144-record shared-field disposition](../../working/pre-manuscript-refinement-2026-09-10/R3-144-RECORD-DISPOSITION.md) plus the [R4 paradigm delta review](../../working/pre-manuscript-refinement-2026-09-10/R4-PARADIGM-DELTA-REVIEW-2026-09-16.md).',
          )
          replace_once(
              m,
              '**Begin at R4.** Read the essay\'s one-breath whole and then all eight stations / forty-eight movement bodies in order. Test whether the linear sequence genuinely performs the refined field, not whether its links resolve. Repair movement placement, transition, withholding/payoff and displaced operations in the movement bodies and governing plan; reopen a canonical owner only where the linear review reveals a real semantic defect. Continue directly through R5 and R6 after the R4 dependency is honestly closed.',
              '**Begin at R5.** Independently cold-read the accepted minute, protocol, 144-record field, governing plan and complete eight-station / forty-eight-movement flow without relying on the drafter\'s self-justification. Verify preservation, source chronology, reader routes, generated surfaces and executable checks; return any real fault to its owner. Continue to R6 only after R5 is honestly closed.',
          )
          replace_once(
              m,
              '| R4 | [Eight-station, forty-eight-movement review](../tickets/refine-04-section-flow.md) | **Active frontier** — the complete essay must develop into and return from the product field; every displaced operation needs a home. |\n| R5 | [Cold semantic review and real validation](../tickets/refine-05-cold-review-and-validation.md) | Blocked by R4 — independently read content, preserved depth, repaired navigation and honest source/implementation status. |',
              '| R4 | [Eight-station, forty-eight-movement review](../tickets/refine-04-section-flow.md) | **Complete** — all 48 bodies read; flow/withholding/payoff repaired; Genesis/Paradigm/Project/Epi-Logos delta folded into §4 and governing surfaces. |\n| R5 | [Cold semantic review and real validation](../tickets/refine-05-cold-review-and-validation.md) | **Active frontier** — independently read content, preserved depth, repaired navigation and honest source/implementation status. |',
          )
          replace_once(
              m,
              '- 2026-09-15: R1–R3 closed in dependency order. The Indian zero chronology, paradigmatic disclosure/Projecthood relation, six-product field, full Power/counterfeit-source braid and 144-record dispositions are now inherited by R4. The R4 movement review—not another canonical vocabulary pass—is the active frontier.',
              '- 2026-09-15: R1–R3 closed in dependency order. The Indian zero chronology, paradigmatic disclosure/Projecthood relation, six-product field, full Power/counterfeit-source braid and 144-record dispositions were inherited by R4.\n- 2026-09-16: R4 closed after the complete 48-movement review and a final Genesis / Paradigm / Project / Epi-Logos delta reread. The central plan, orientation and Agentworld matrix now carry the same relation. R5 is the active frontier.',
          )
          replace_once(
              m,
              'Refinement is authorised. The completed section-flow review, cold review, envelope table and exact common writing base still require **Frank\'s T26/#27 ratification**. Do not confuse R1–R3 completion with acceptance of work not yet performed.',
              'Refinement is authorised. The cold review, envelope table and exact common writing base still require **Frank\'s T26/#27 ratification**. Do not confuse R1–R4 completion with acceptance of R5/R6 or manuscript prose.',
          )
          PY

      - name: Commit closure receipts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-return-of-zero-central-plan.md \
                  working/pre-manuscript-refinement-2026-09-10/R4-MOVEMENT-REVIEW-25-48.md \
                  working/pre-manuscript-refinement-2026-09-10/R4-PARADIGM-DELTA-REVIEW-2026-09-16.md \
                  .wayfinder/tickets/refine-04-section-flow.md \
                  .wayfinder/maps/p2-enrichment-handoff.md
          git diff --cached --check
          git commit -m 'T25 R4: close paradigmatic delta and release R5'
          git push origin HEAD:main
