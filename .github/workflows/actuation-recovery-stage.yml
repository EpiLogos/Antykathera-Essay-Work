name: Stage source-verified Actuation recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actuation-recovery-stage.yml'
      - 'working/canonical-argument-recovery-2026-09-25/actuation-logos-2026-09-27/delivery/**'
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare native builders
        run: python3 -m pip install PyYAML
      - name: Apply verified data, check records, build projections, stage unattached objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 working/canonical-argument-recovery-2026-09-25/actuation-logos-2026-09-27/delivery/stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actuation-stage-${{ github.sha }}
          path: ${{ runner.temp }}/actuation-stage/
          retention-days: 7
          if-no-files-found: error
