name: T25 R5 bounded semantic repair

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r5-semantic-repair.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply F1-F8 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one repair target, found {n}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # F1 — stable movement alias, current product title.
          replace_once(
              'submission-package/essay/section-rooms/01-differentiating-mind/movements/11-s0-p4-tattvic-compression.md',
              '[[38-s5-p1-apoha-softmax|§5 · #1 — Apoha, Softmax, and Argmax]], where differential selection is investigated inside an artificial operative interior rather than treated as an isolated analogy.',
              '[[38-s5-p1-apoha-softmax|§5 · #1 — Actuation — Living Articulation]], where apoha, softmax and differential selection are investigated as depth inside an artificial operative event rather than treated as an isolated analogy.'
          )

          # F2 — mathematical witness is not the transcendental claim itself.
          replace_once(
              'submission-package/essay/section-rooms/02-return-of-zero/movements/17-s1-p4-zero-outside-math.md',
              'The same structure appeared at the formal limit: a system cannot exhaustively account for the condition from which its accounting proceeds. The gap is the exact interval between a formal world and the operation by which that world is constituted and bounded. This is the mathematical form of the immutable gap: not an occult elsewhere, but the non-eliminable edge at which every determinate account reveals what it presupposes. Because the interval is structurally derived, it cannot be moved opportunistically to wherever an explanation happens to stop.',
              'The same structural pressure appeared at the formal limit: a system cannot exhaustively account for the condition from which its accounting proceeds. Division by zero supplies a mathematically exact **neighbour and witness** to that frame-disclosing non-coincidence: under a declared algebra, the exceptional expression exposes the laws and limits of the container. It does not by itself derive the essay’s transcendental immutable-gap claim, whose wider argument concerns the non-coincidence between a determinate account and the condition of accounting. Keeping those warrants distinct prevents a local mathematical boundary from being promoted into the metaphysics it is used to illuminate.'
          )

          # F3 — polar dia retains zero; only the collapsed operations cancel/appropriate.
          replace_once(
              'submission-package/essay/section-rooms/02-return-of-zero/movements/18-s1-p5-loan-returns.md',
              'The recovered zero reveals why “binary logic” is ambiguous. One binary opposes `+1` and `−1` around an external zero. The other relates `0/1` and `1/0`, retaining zero within both orientations. Their difference determines whether intelligence treats conflict as the collision of self-grounding camps or as differentiation within a shared but irreducible field.',
              'The recovered zero reveals why “binary logic” is ambiguous. The next station first gives **polar dia-ballein** as `(-1)/(+1)`, where zero remains the axis of tension and connection; only its collapsed operations cancel the poles into `0` or appropriate their span into `±2`. **Sym-ballein** then relates `0/1` and `1/0`, retaining ground, mark and their inverse orientations within one differentiated relation. The distinction is therefore not “external zero versus internal zero,” but whether the cut remains answerable to its generating relation or is collapsed into operations on apparently self-grounding terms.'
          )

          # F4 — mytheme tests/figures; it does not prove.
          replace_once(
              'submission-package/essay/section-rooms/03-two-logics/movements/22-s2-p3-ares-aphrodite-harmonia.md',
              '[[symbolon/episteme/arguments/A23-Trust-Faith-and-the-Formal-Limit|Trust, Faith, and the Formal Limit]] receives this as its mythic proof-case,',
              '[[symbolon/episteme/arguments/A23-Trust-Faith-and-the-Formal-Limit|Trust, Faith, and the Formal Limit]] receives this as a mythic test-case and enactment,'
          )

          # F5 — formal field is derived; psychoid extension remains argued/research-facing.
          replace_once(
              'submission-package/essay/section-rooms/05-psychoid-flowering/movements/31-s4-p0-psychoid-problem.md',
              'The [[symbolon/episteme/arguments/A16-Arche-Topos-as-Differential-Field|Arche-Topos as Differential Field]] derives the psychoid structure through the complete theorem braid; each psychological or experiential source remains responsible only for the region it actually discloses.',
              'The [[symbolon/episteme/arguments/A16-Arche-Topos-as-Differential-Field|Arche-Topos as Differential Field]] derives the native **formal differential field** through the complete theorem braid; its extension across the psyche–physis distinction is **Argued and research-facing**, not a mathematical consequence. Each psychological or experiential source remains responsible only for the region it actually discloses.'
          )

          # F6 — correct the von Neumann floor without weakening the native reading.
          replace_once(
              'submission-package/essay/symbolon/episteme/conjugate/AC.md',
              '`2 = 0/1` is the standard notation read with the reverence it never asked for; against it the fallen `1 + (−1)` is a late arrival of debt-bookkeeping.',
              'The standard von Neumann statements stop at `0 = ∅`, `1 = {0}` and `2 = {0,1}`. The essay’s `0/1` is a separate native QL relational reading placed beside that formal neighbour; it is neither standard notation for ordinal `2` nor ordinary fraction division. Against this authorial relational reading, the fallen `1 + (−1)` is a later signed accounting with a different operation.'
          )

          # F7 — S receives the chronology already resolved downstream.
          replace_once(
              'submission-package/essay/symbolon/episteme/products/S-World-and-Life.md',
              "Frank's Kaplan encounter points specifically to the twelfth-century scene whose retained English witness is Bhāskara's *Bījagaṇita* I.14/I.16: a cipher denominator and an image of divine invariance amid manifestation and withdrawal. The [R1 grounding return](../../../../../working/pre-manuscript-refinement-2026-09-10/R1-GROUNDING-RETURN.md#indian-scene-and-exact-remaining-collation) keeps the intended Abhinavagupta interval as a precise collation task. This is not an interchangeable story about any formal limit or a universal first-invention date.",
              "Frank's Kaplan encounter points specifically to the twelfth-century scene whose retained English witness is Bhāskara's *Bījagaṇita* I.14/I.16: a cipher denominator and an image of divine invariance amid manifestation and withdrawal. The later collation now bounds the intended relation through separate public records: Abhinavagupta conventionally **c.975–1025** and Bhāskara II's *Bījagaṇita* **1150**, roughly the author's century-scale interval. This is an Argued civilisational juxtaposition, not a transmission claim, an interchangeable formal-limit story or a universal first-invention date. Any stronger historical relation retains its own source duties."
          )

          # F8 — A03, not A02, owns the formal-limit office.
          replace_once(
              'submission-package/essay/symbolon/episteme/arguments/A36-Advent-of-Integral-Zero.md',
              '[[A02-Copula-Self-Identity-through-Difference|The formal limit]] is thus performed again through a changed capacity to answer it.',
              '[[A03-Immutable-Gap-Formal-Limit|The formal limit]] is thus performed again through a changed capacity to answer it.'
          )
          PY

      - name: Commit the cold-review semantic batch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            submission-package/essay/section-rooms/01-differentiating-mind/movements/11-s0-p4-tattvic-compression.md \
            submission-package/essay/section-rooms/02-return-of-zero/movements/17-s1-p4-zero-outside-math.md \
            submission-package/essay/section-rooms/02-return-of-zero/movements/18-s1-p5-loan-returns.md \
            submission-package/essay/section-rooms/03-two-logics/movements/22-s2-p3-ares-aphrodite-harmonia.md \
            submission-package/essay/section-rooms/05-psychoid-flowering/movements/31-s4-p0-psychoid-problem.md \
            submission-package/essay/symbolon/episteme/conjugate/AC.md \
            submission-package/essay/symbolon/episteme/products/S-World-and-Life.md \
            submission-package/essay/symbolon/episteme/arguments/A36-Advent-of-Integral-Zero.md
          git diff --cached --check
          git commit -m 'T25 R5: repair eight cold semantic faults'
          git push origin HEAD:main
