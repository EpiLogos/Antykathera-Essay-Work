name: T25 R5 final read-only validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r5-final-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - run: python3 -m pip install PyYAML

      - name: Check every generated surface and live reader contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-t25-refinement-admission.py --check
          python3 tools/build-source-projections.py --check
          python3 tools/build-section-rooms.py --check
          python3 tools/build-navigation.py --check
          python3 tools/audit-reader-navigation.py --project-root . --output "$RUNNER_TEMP/r5-reader.json"
          python3 - <<'PY'
          import json, os, pathlib
          r=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'r5-reader.json'))
          protected={'NOTES.md','AUTHORIAL-TEXT.md','HISTORY.md','READING.md','SCRATCH.md','SOURCE-TEMPLATE.md'}
          dead=[p for p in r['no_visible_path_to_movement'] if '/concepts/reference-notes/' not in p and pathlib.Path(p).name not in protected]
          print('reader counts:', r['counts'])
          print('visible dead ends:', dead)
          assert r['counts']['admitted'] == 288, r['counts']
          assert r['counts']['missing_admitted'] == 0, r['counts']
          assert r['counts']['unreachable_admitted'] == 0, r['counts']
          assert not dead, dead
          PY

      - name: Run complete repository suite
        run: python3 -m unittest discover -s tests -v

      - name: Run all eight room-depth audits
        shell: bash
        run: |
          set -euo pipefail
          rooms=(00-integral-threshold 01-differentiating-mind 02-return-of-zero 03-two-logics 04-mathematical-substrate 05-psychoid-flowering 06-objective-internality 07-instrument-returns)
          args=()
          for room in "${rooms[@]}"; do args+=(--room "$room"); done
          python3 tools/audit-room-depth.py --project-root . "${args[@]}"

      - name: Verify protected preservation anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:submission-package/essay/THE-RETURN-OF-ZERO.md)" = "df84af01672eecb57ec6e17aed416cb0045cfe62"
          test "$(git rev-parse HEAD:submission-package/essay/symbolon/episteme/products/S1-Actuation.md)" = "c3bc08715693fda275ccb1b9be8a318e1f12303d"
          test "$(git rev-parse HEAD:working/pre-manuscript-refinement-2026-09-10/recovery/originals/S1-Actuation.md.original)" = "c3bc08715693fda275ccb1b9be8a318e1f12303d"
          git diff --check
