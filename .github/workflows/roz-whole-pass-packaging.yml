name: Return of Zero whole-pass packaging
on:
  push:
    branches: [codex/manuscript-source-enrichment-2026-09-20]
    paths:
      - .github/workflows/roz-whole-pass-packaging.yml
      - working/manuscript-source-enrichment-2026-09-20/assembly/build_whole_pass.py
      - working/manuscript-source-enrichment-2026-09-20/assembly/whole-pass-edits.json
      - working/manuscript-source-enrichment-2026-09-20/assembly/BUILD.json
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/codex/manuscript-source-enrichment-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact textual working inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess, hashlib, json
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/roz-source-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  p=Path(f)
                  if f and not p.is_symlink() and p.is_file() and p.suffix.lower() in {'.md','.json','.txt','.py','.html','.css','.yml','.yaml','.toml'}:
                      z.write(p,f)
              z.writestr('SNAPSHOT-HEAD.txt',subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: roz-source-snapshot
          path: /tmp/roz-source-snapshot.zip
          retention-days: 7
      - name: Build explicitly enabled editorial candidate
        run: |
          ROOT=working/manuscript-source-enrichment-2026-09-20/assembly
          if [ -f "$ROOT/BUILD.json" ] && [ -f "$ROOT/build_whole_pass.py" ]; then
            python3 "$ROOT/build_whole_pass.py"
          fi
      - name: Publish only assembled outputs
        run: |
          ROOT=working/manuscript-source-enrichment-2026-09-20/assembly
          if [ -f "$ROOT/BUILD.json" ] && [ -f "$ROOT/THE-RETURN-OF-ZERO.md" ]; then
            git config user.name 'Return of Zero assembly'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ROOT"
            if ! git diff --cached --quiet; then
              git commit -m 'Publish reviewed whole-pass manuscript and reader [skip ci]'
              git push origin HEAD:refs/heads/codex/manuscript-source-enrichment-2026-09-20
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('working/manuscript-source-enrichment-2026-09-20/assembly/BUILD.json') != ''
        with:
          name: roz-whole-pass-reader
          path: working/manuscript-source-enrichment-2026-09-20/assembly/
          retention-days: 30
