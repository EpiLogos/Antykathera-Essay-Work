name: Return of Zero whole-pass packaging
on:
  push:
    branches: [codex/manuscript-source-enrichment-2026-09-20]
    paths:
      - .github/workflows/roz-whole-pass-packaging.yml
      - working/manuscript-source-enrichment-2026-09-20/assembly/build_whole_pass.py
      - working/manuscript-source-enrichment-2026-09-20/assembly/editorial_revisions.py
      - working/manuscript-source-enrichment-2026-09-20/assembly/BUILD.json
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/codex/manuscript-source-enrichment-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require explicit assembly gate
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('working/manuscript-source-enrichment-2026-09-20/assembly/BUILD.json')
          enabled=p.is_file() and json.loads(p.read_text()).get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled='+str(enabled).lower()+'\n')
          PY
      - name: Install pinned rendering dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 -m pip install 'mistune==3.2.1'
          npm install --prefix /tmp/roz-render --no-audit --no-fund 'katex@0.16.22'
      - name: Build the explicit editorial candidate
        if: steps.gate.outputs.enabled == 'true'
        env:
          ROZ_KATEX_MODULE: /tmp/roz-render/node_modules/katex
        run: python3 working/manuscript-source-enrichment-2026-09-20/assembly/build_whole_pass.py
      - name: Publish only assembled outputs
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ROOT=working/manuscript-source-enrichment-2026-09-20/assembly
          test -f "$ROOT/THE-RETURN-OF-ZERO.md"
          git config user.name 'Return of Zero assembly'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed whole-pass manuscript and reader [skip ci]'
            git push origin HEAD:refs/heads/codex/manuscript-source-enrichment-2026-09-20
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.enabled == 'true'
        with:
          name: roz-whole-pass-reader
          path: working/manuscript-source-enrichment-2026-09-20/assembly/
          retention-days: 30
