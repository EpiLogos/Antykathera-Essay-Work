name: T25 R5 read-only executable validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r5-validation-pass.yml']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install validation dependency
        run: python3 -m pip install PyYAML

      - name: Regenerate current derived surfaces in the runner only
        id: regenerate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/build-t25-refinement-admission.py
          python3 tools/build-source-projections.py
          python3 tools/build-section-rooms.py
          python3 tools/build-navigation.py

      - name: Check reproducibility and reader audit
        id: readers
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/build-t25-refinement-admission.py --check
          python3 tools/build-source-projections.py --check
          python3 tools/build-section-rooms.py --check
          python3 tools/build-navigation.py --check
          python3 tools/audit-reader-navigation.py --project-root . --output "$RUNNER_TEMP/reader-audit.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'reader-audit.json'
          if p.exists():
              r=json.loads(p.read_text())
              protected={'NOTES.md','AUTHORIAL-TEXT.md','HISTORY.md','READING.md','SCRATCH.md','SOURCE-TEMPLATE.md'}
              dead=[x for x in r['no_visible_path_to_movement'] if '/concepts/reference-notes/' not in x and pathlib.Path(x).name not in protected]
              print('READER COUNTS', r['counts'])
              print('VISIBLE DEAD ENDS')
              print('\n'.join(dead) if dead else '(none)')
          PY

      - name: Run complete unit suite
        id: suite
        shell: bash
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v

      - name: Run documented room-depth audit
        id: depth
        shell: bash
        continue-on-error: true
        run: |
          rooms=(00-integral-threshold 01-differentiating-mind 02-return-of-zero 03-two-logics 04-mathematical-substrate 05-psychoid-flowering 06-objective-internality 07-instrument-returns)
          args=()
          for room in "${rooms[@]}"; do args+=(--room "$room"); done
          python3 tools/audit-room-depth.py --project-root . "${args[@]}"

      - name: Report pass statuses
        shell: bash
        run: |
          echo "regenerate=${{ steps.regenerate.outcome }}"
          echo "readers=${{ steps.readers.outcome }}"
          echo "suite=${{ steps.suite.outcome }}"
          echo "depth=${{ steps.depth.outcome }}"
          git diff --check || true
          git status --short
