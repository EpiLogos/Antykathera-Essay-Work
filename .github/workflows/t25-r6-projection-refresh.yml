name: T25 R6 bounded projection refresh

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t25-r6-projection-refresh.yml']

permissions:
  contents: write

concurrency:
  group: t25-r6-projection-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'EpiLogos/Antykathera-Essay-Work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install validation dependency
        run: python3 -m pip install PyYAML

      - name: Regenerate derived reader surfaces only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-t25-refinement-admission.py --check
          python3 tools/build-source-projections.py
          python3 tools/build-section-rooms.py
          python3 tools/build-navigation.py

      - name: Check bounded reader contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-source-projections.py --check
          python3 tools/build-section-rooms.py --check
          python3 tools/build-navigation.py --check
          python3 tools/audit-reader-navigation.py --project-root . --output "$RUNNER_TEMP/r6-reader.json"
          python3 - <<'PY'
          import json, os, pathlib
          report=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'r6-reader.json'))
          protected={'NOTES.md','AUTHORIAL-TEXT.md','HISTORY.md','READING.md','SCRATCH.md','SOURCE-TEMPLATE.md'}
          dead=[p for p in report['no_visible_path_to_movement'] if '/concepts/reference-notes/' not in p and pathlib.Path(p).name not in protected]
          assert report['counts']['admitted'] == 288, report['counts']
          assert report['counts']['missing_admitted'] == 0, report['counts']
          assert report['counts']['unreachable_admitted'] == 0, report['counts']
          assert not dead, dead
          print('reader counts:', report['counts'])
          print('visible dead ends:', dead)
          PY
          python3 -m unittest tests.test_build_navigation tests.test_build_section_rooms tests.test_pre_manuscript_gate -v
          test "$(git rev-parse HEAD:submission-package/essay/THE-RETURN-OF-ZERO.md)" = "df84af01672eecb57ec6e17aed416cb0045cfe62"
          git diff --check

      - name: Commit refreshed projections if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            submission-package/essay/section-rooms/*/ROOM.md \
            submission-package/essay/symbolon/episteme/maps/navigation \
            submission-package/essay/symbolon/episteme/sources/MAIN-SOURCES.md \
            submission-package/essay/symbolon/episteme/sources/PASSAGE-LEDGER.md \
            submission-package/essay/symbolon/episteme/sources/SOURCE-INDEX.md
          if git diff --cached --quiet; then
            echo 'derived surfaces already current'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'T25 R6: refresh derived surfaces after truth-strength pass'
          git push origin HEAD:main
