name: Temporary regenerate source projections for MVI

on:
  push:
    branches:
      - source/minimum-viable-interiority
    paths:
      - .github/workflows/tmp-regenerate-source-projections-mvi.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: source/minimum-viable-interiority
          fetch-depth: 0

      - name: Install projection dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Rebuild generated source projections
        run: python tools/build-source-projections.py

      - name: Commit generated projections
        shell: bash
        run: |
          git config user.name "EpiLogos source projections"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission-package/essay/symbolon/episteme/sources/MAIN-SOURCES.md \
                  submission-package/essay/symbolon/episteme/sources/SOURCE-INDEX.md \
                  submission-package/essay/symbolon/episteme/sources/PASSAGE-LEDGER.md
          if git diff --cached --quiet; then
            echo "Source projections already current."
          else
            git commit -m "Regenerate source projections for Minimum Viable Interiority"
            git push origin HEAD:source/minimum-viable-interiority
          fi
